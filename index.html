<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>商家经营 CRM · 商业化平台侧</title>
<meta name="description" content="面向商业化平台侧运营的商家经营 CRM 演示：商业化大盘、商家分层管理、消费者转化链路断点诊断，以及打法卡与产品需求两种沉淀物的闭环。单文件纯前端作品，全部数据为虚构。">
<style>
:root{
  --red:#FF2442; --red-600:#E51E3A; --red-700:#C4162E; --red-50:#FFF1F3; --red-100:#FFE0E5;
  --bg:#F6F6F8; --card:#FFFFFF; --line:#EDEDF0; --line2:#E2E2E8;
  --t1:#1B1B1F; --t2:#66666E; --t3:#9A9AA2; --t4:#C2C2C9;
  --green:#00B578; --green-50:#E7F8F1;
  --orange:#FF8F1F; --orange-50:#FFF4E6;
  --blue:#3B6EFF; --blue-50:#EDF2FF;
  --purple:#7B5CFF; --purple-50:#F2EEFF;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:20px;
  --sh:0 1px 2px rgba(22,22,32,.04), 0 4px 14px rgba(22,22,32,.045);
  --sh-hover:0 2px 6px rgba(22,22,32,.06), 0 10px 26px rgba(22,22,32,.08);
  --sw:218px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#DCDCE2;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}

.sidebar{
  width:var(--sw);flex:0 0 var(--sw);position:fixed;inset:0 auto 0 0;z-index:40;
  background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:0 12px 12px;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 10px 16px}
.brand-mark{
  width:32px;height:32px;border-radius:10px;flex:0 0 32px;
  background:linear-gradient(135deg,var(--red) 0%,#FF5C4D 100%);
  display:grid;place-items:center;color:#fff;box-shadow:0 4px 10px rgba(255,36,66,.28);
}
.brand-mark svg{width:19px;height:19px}
.brand-txt strong{display:block;font-size:14px;font-weight:600;letter-spacing:.2px}
.brand-txt span{display:block;font-size:11px;color:var(--t3);margin-top:1px}

.nav-label{font-size:11px;color:var(--t4);padding:14px 10px 6px;font-weight:600;letter-spacing:.6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-m);
  color:var(--t2);font-size:13.5px;font-weight:500;transition:.16s;position:relative;
}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.82}
.nav-item:hover{background:#F7F7F9;color:var(--t1)}
.nav-item.on{background:var(--red-50);color:var(--red-600);font-weight:600}
.nav-item.on svg{opacity:1}
.nav-item.on::before{
  content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--red);
}
.nav-badge{
  margin-left:auto;font-size:10.5px;font-weight:600;background:var(--red);color:#fff;
  min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 5px;
}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.about-btn{
  width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r-m);
  color:var(--t3);font-size:12.5px;transition:.16s;
}
.about-btn svg{width:16px;height:16px}
.about-btn:hover{background:#F7F7F9;color:var(--t1)}

.main{flex:1;margin-left:var(--sw);min-width:0;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:30;background:rgba(246,246,248,.86);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding:0 28px;height:58px;display:flex;align-items:center;gap:14px;
}
.topbar h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.2px}
.topbar .sub{font-size:12px;color:var(--t3);margin-left:2px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}

.switcher{
  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);
  border-radius:99px;padding:5px 12px 5px 6px;font-size:13px;font-weight:500;transition:.16s;
}
.switcher:hover{border-color:var(--t4)}
.switcher .dot{width:22px;height:22px;border-radius:99px;background:var(--red-50);color:var(--red-600);display:grid;place-items:center;font-size:10px;font-weight:700}
.switcher svg{width:14px;height:14px;color:var(--t3)}
.icon-btn{
  width:34px;height:34px;border-radius:99px;display:grid;place-items:center;color:var(--t2);
  border:1px solid transparent;transition:.16s;position:relative;
}
.icon-btn:hover{background:#EFEFF2}
.icon-btn svg{width:18px;height:18px}
.icon-btn .pip{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:99px;background:var(--red);border:2px solid var(--bg)}

.view{padding:22px 28px 104px;max-width:1360px;width:100%}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card-h h3{margin:0;font-size:14.5px;font-weight:600}
.card-h .desc{font-size:12px;color:var(--t3);margin-left:auto}
.card-b{padding:16px 18px 18px}
.sec-title{display:flex;align-items:center;gap:8px;margin:26px 2px 12px;font-size:14px;font-weight:600;color:var(--t1)}
.sec-title .hint{font-size:12px;color:var(--t3);font-weight:400}
.sec-title svg{width:16px;height:16px;color:var(--t3)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.red{background:var(--red-50);color:var(--red-600)}
.pill.green{background:var(--green-50);color:var(--green)}
.pill.orange{background:var(--orange-50);color:#D97A00}
.pill.blue{background:var(--blue-50);color:var(--blue)}
.pill.purple{background:var(--purple-50);color:var(--purple)}
.pill.gray{background:#F2F2F5;color:var(--t2)}

.delta{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:2px}
.delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--t3)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:16px 18px 14px;position:relative;overflow:hidden}
.kpi .lab{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--t2);font-weight:500}
.kpi .lab svg{width:15px;height:15px;color:var(--t3)}
.kpi .val{font-size:27px;font-weight:700;letter-spacing:-.5px;margin:9px 0 5px;font-variant-numeric:tabular-nums}
.kpi .val .unit{font-size:14px;font-weight:600;color:var(--t2);margin-left:3px;letter-spacing:0}
.kpi .foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--t3)}
.kpi .spark{position:absolute;right:0;bottom:0;width:104px;height:44px;opacity:.5}

/* journey chain */
.journey{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 2px 8px}
/* 每一步的内容居中,是为了让箭头真的落在两个图标之间:
   内容左对齐时图标贴在自己那一列的左缘,而箭头居中在连接列里,
   两者差半列宽,看着就是「箭头偏右、离右边那个图标更近」。
   居中之后图标中心 = 列中心,连接件自然就是两个图标的正中间。 */
.jstep{flex:1 1 0;min-width:132px;display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:0 4px}
.jstep .ico{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;margin-bottom:10px;
  background:#F4F4F7;color:var(--t2);transition:.2s;
}
.jstep .ico svg{width:20px;height:20px}
.jstep.hot .ico{background:var(--red-50);color:var(--red)}
.jstep .name{font-size:12.5px;color:var(--t2);font-weight:500;margin-bottom:3px}
.jstep .num{font-size:20px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.jstep .note{font-size:11px;color:var(--t3);margin-top:3px}
.jlink{
  flex:0 0 76px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:5px;color:var(--t3);
}
/* 箭头行固定 40px = 图标块高度,所以每一处连接件都落在和图标同一个水平线上;
   转化率只作为它下面的读数,不再参与定位。 */
.jlink .arrow{
  width:100%;height:40px;display:flex;align-items:center;justify-content:center;
  color:var(--t3);
}
.jlink .arrow svg{width:26px;height:26px;display:block;stroke-width:2}
.jlink .rate{
  font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.35;
}
.jlink .drop{font-size:10.5px;color:var(--t3);white-space:nowrap;line-height:1.35}

/* alert list */
.alerts{display:flex;flex-direction:column}
.alert{
  display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:var(--r-m);
  border-bottom:1px solid var(--line);cursor:pointer;transition:.14s;
}
.alert:last-child{border-bottom:0}
.alert:hover{background:#FAFAFC}
.alert .sev{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 26px}
.alert .sev svg{width:15px;height:15px}
.sev.high{background:var(--red-50);color:var(--red)}
.sev.mid{background:var(--orange-50);color:#D97A00}
.sev.low{background:#F2F2F5;color:var(--t2)}
.alert .who{font-size:13.5px;font-weight:600;white-space:nowrap;flex:0 0 auto}
.alert .what{font-size:12.5px;color:var(--t2);min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert .meta{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.alert .time{font-size:11.5px;color:var(--t3)}

/* three-way value */
.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{padding:15px 16px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--card)}
.tcard .hd{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--t2)}
.tcard .hd .chip{width:22px;height:22px;border-radius:7px;display:grid;place-items:center}
.tcard .hd .chip svg{width:13px;height:13px}
.tcard .big{font-size:21px;font-weight:700;margin:10px 0 4px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.tcard .fine{font-size:11.5px;color:var(--t3)}
.tcard a{display:block}
.link-a{color:var(--blue);font-weight:600}
.hr{height:1px;background:var(--line);margin:16px 0}

.two-col{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.kpis>*,.two-col>*,.triple>*{min-width:0}

/* placeholder */
.ph{display:grid;place-items:center;padding:64px 24px;text-align:center}
.ph .ic{width:56px;height:56px;border-radius:18px;background:var(--red-50);color:var(--red);display:grid;place-items:center;margin-bottom:16px}
.ph .ic svg{width:26px;height:26px}
.ph h2{margin:0 0 6px;font-size:16px;font-weight:600}
.ph p{margin:0;color:var(--t3);font-size:13px;max-width:460px}
.ph .todo{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px}
.ph .todo span{font-size:12px;color:var(--t2);background:var(--card);border:1px solid var(--line2);border-radius:99px;padding:5px 12px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(20,20,28,.42);backdrop-filter:blur(3px);z-index:80;display:grid;place-items:center;padding:24px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:var(--r-xl);max-width:720px;width:100%;max-height:84vh;overflow:auto;box-shadow:0 24px 60px rgba(20,20,40,.24);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:10px;padding:20px 22px 14px;position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:15px;font-weight:600}
.modal-h .x{margin-left:auto;width:30px;height:30px;border-radius:99px;display:grid;place-items:center;color:var(--t2)}
.modal-h .x:hover{background:#F2F2F5}
.modal-b{padding:18px 22px 24px}

.matrix{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:#FCFCFD}
.mrow.me{border-color:var(--red-100);background:var(--red-50)}
.mrow .stage{font-size:12px;color:var(--t3);flex:0 0 88px}
.mrow .prod{font-size:13px;font-weight:600}
.mrow.me .prod{color:var(--red-700)}
.mrow .tag{margin-left:auto;font-size:11px;color:var(--t3)}
.mrow.me .tag{color:var(--red-600);font-weight:600}

/* ---------- tabs / 商家列表 ---------- */
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:6px 13px;border-radius:99px;font-size:12.5px;font-weight:500;color:var(--t2);
  background:var(--card);border:1px solid var(--line2);transition:.15s}
.tab:hover{border-color:var(--t4)}
.tab.on{background:var(--t1);color:#fff;border-color:var(--t1)}
.tab .n{opacity:.6;margin-left:5px;font-size:11.5px;font-variant-numeric:tabular-nums}

/* 健康度筛选芯片。它和生命周期分层是**两个正交的维度**,所以不做成又一个 tab,
   而是推到这一行的右端、用不同形态区分开:tab 选「生命周期哪一段」,芯片选「健康度线以下」。 */
.riskchip{margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:6px 13px;
  border-radius:99px;font-size:12.5px;font-weight:500;color:var(--t2);background:var(--card);
  border:1px solid var(--line2);cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.riskchip:hover{border-color:var(--t4)}
.riskchip.on{background:var(--red-50);color:var(--red-600);border-color:var(--red-100);font-weight:600}
/* 计数为 0 时只变淡,不移除 —— 控件位置稳定,才敢放心做「没有就是结论」的空态 */
.riskchip.zero{opacity:.5}
.riskchip.zero:hover{opacity:.8}
.riskchip .n{opacity:.7;margin-left:2px;font-size:11.5px;font-variant-numeric:tabular-nums}

.tierbar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:4px 0 12px;background:#F0F0F3}
.tierbar i{display:block;height:100%}
/* 单层内部是同色阶的相邻档,浅档之间靠一道白缝区分 */
.tierbar i + i{box-shadow:-1px 0 0 #fff}
.tierleg{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--t2)}
.tierleg b{font-variant-numeric:tabular-nums;color:var(--t1)}
.tierleg .d{width:8px;height:8px;border-radius:3px;display:inline-block;margin-right:6px}
.tierleg .seg{border-radius:6px;transition:.13s}
.tierleg .seg.click{cursor:pointer}
.tierleg .seg.click:hover{color:var(--red-600)}
.tierleg .seg.click:hover b{color:var(--red-600)}

/* ---- 分层口径 · 默认收起,点标题才展开 ----
   页面常驻的应该是数据本身,规则放在一次点击之后,不跟看板抢注意力 */
.tiernote{margin-top:14px;border-radius:var(--r-m);background:#FAFAFB;border:1px solid var(--line);
  font-size:12px;line-height:1.7;color:var(--t2);overflow:hidden}
.tn-head{display:flex;align-items:center;gap:7px;width:100%;padding:9px 14px;background:none;border:0;
  cursor:pointer;font-family:inherit;font-size:12px;color:var(--t1);text-align:left;transition:.14s}
.tn-head:hover{background:#F5F5F7}
.tn-head > svg{flex:0 0 auto;color:var(--t3)}
.tn-head .tn-title{font-weight:600}
.tn-head .tn-hint{color:var(--t3);font-size:11.5px;font-weight:400}
.tn-head .chev{margin-left:auto;display:inline-flex;color:var(--t3);transition:transform .18s}
.tiernote.on .tn-head .chev{transform:rotate(180deg)}
.tn-body{padding:10px 14px 12px;border-top:1px solid var(--line)}
.tn-body .rl{display:flex;gap:8px;align-items:baseline}
.tn-body .rl + .rl{margin-top:3px}
.tn-body .st{flex:0 0 16px;height:16px;border-radius:5px;background:var(--red-50);color:var(--red-600);
  font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
  position:relative;top:2px}
.tn-body .rl b{color:var(--t1)}
.tn-body .ft{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);color:var(--t3);font-size:11.5px}
.pill-why{cursor:help}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;min-width:660px}
.tbl th{font-size:11.5px;font-weight:600;color:var(--t3);text-align:left;padding:9px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:#FCFCFD}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl tr.cursor{cursor:pointer;transition:.13s}
.tbl tr.cursor:hover{background:#FAFAFC}
.tbl tr:last-child td{border-bottom:0}
.tbl .mname{font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tbl .num{font-variant-numeric:tabular-nums;font-weight:600}
.tbl .ghost{font-size:11.5px;color:var(--t3)}
.btn-mini{font-size:12px;font-weight:600;color:var(--red-600);background:var(--red-50);
  padding:5px 11px;border-radius:99px;transition:.15s;white-space:nowrap}
.btn-mini:hover{background:var(--red-100)}
.btn-ghost{font-size:12.5px;font-weight:500;color:var(--t2);background:var(--card);
  border:1px solid var(--line2);padding:7px 14px;border-radius:99px;transition:.15s}
.btn-ghost:hover{border-color:var(--t4);color:var(--t1)}
.btn-solid{font-size:12.5px;font-weight:600;color:#fff;background:var(--red);
  padding:8px 16px;border-radius:99px;transition:.15s;box-shadow:0 3px 10px rgba(255,36,66,.24)}
.btn-solid:hover{background:var(--red-600)}

.health{display:flex;align-items:center;gap:8px;min-width:108px}
.health .bar{flex:1;height:6px;border-radius:99px;background:#F0F0F3;overflow:hidden}
.health .bar i{display:block;height:100%;border-radius:99px}
.health .v{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
.health.why{cursor:help}

/* ---------- 双入口 ---------- */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ecard{border:1px solid var(--line);border-radius:var(--r-m);padding:13px 15px;background:#FCFCFD;position:relative}
.ecard.brk{border-color:var(--red-100);background:var(--red-50)}
.ecard .t{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;margin-bottom:10px}
.ecard .t .chip{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:0 0 22px}
.ecard .t .chip svg{width:13px;height:13px}
.ecard .t .badge{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--red);
  background:var(--card);border-radius:99px;padding:2px 8px}
/* 入口名带一个 ⓘ:悬停说明这个入口是怎么触达用户的 —— 两个入口的 CTR 差好几倍,
   不解释清楚「主动意图 vs 被动推荐」,读者会以为数字填错了 */
.ecard .t .ent-nm{display:inline-flex;align-items:center;gap:4px;cursor:help}
.ecard .t .ent-nm .ent-info{display:inline-flex;color:var(--t4);transition:color .15s}
.ecard .t .ent-nm:hover .ent-info{color:var(--blue)}
/* 标签与数值挨着排,标签定宽 → 三行的值左端对齐成一列。
   原先用 space-between 把值推到卡片右边缘,和标签隔着大半张卡,读的时候配不成对 */
.ecard .row{display:flex;align-items:baseline;gap:9px;padding:3.5px 0;font-size:12.5px}
.ecard .row .k{flex:0 0 30px;color:var(--t3);font-size:11.5px;font-weight:600}
.ecard .row b{font-variant-numeric:tabular-nums;color:var(--t1);font-size:13.5px;font-weight:600}

.merge{display:flex;align-items:center;gap:10px;justify-content:center;padding:12px 0 2px;
  font-size:12px;color:var(--t3)}
.merge .line{height:1px;background:var(--line2);flex:1}

.jstep .flag{margin-top:6px;font-size:10.5px;font-weight:700;color:var(--red);
  background:var(--red-50);border-radius:99px;padding:2px 8px;display:inline-block}
.jstep.bad .ico{background:var(--red-50);color:var(--red);box-shadow:0 0 0 3px rgba(255,36,66,.10)}

.callout{display:flex;gap:10px;padding:13px 15px;border-radius:var(--r-m);font-size:12.5px;line-height:1.7}
.callout.warn{background:var(--red-50);color:var(--red-700)}
.callout.ok{background:var(--green-50);color:#06794F}
.callout.neutral{background:#F5F5F7;color:var(--t2)}
.callout b{font-weight:700}
.callout svg{flex:0 0 auto;margin-top:1px}

/* ---------- CPA 拆解 ---------- */
.cpa-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.slider{padding:9px 0}
.slider .top{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--t2);margin-bottom:8px}
.slider .top .nm{font-weight:600;color:var(--t1)}
.slider .top b{margin-left:auto;font-size:16px;font-variant-numeric:tabular-nums;color:var(--t1)}
.slider .top .range{font-size:11px;color:var(--t3)}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;
  background:#EDEDF0;outline:0;display:block;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:99px;
  background:var(--red);border:3px solid #fff;box-shadow:0 1px 5px rgba(255,36,66,.45);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:99px;background:var(--red);
  border:3px solid #fff;cursor:pointer}

.formula{background:#FBFBFC;border:1px solid var(--line);border-radius:var(--r-m);padding:13px 15px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--t2);
  line-height:2;overflow-x:auto;white-space:nowrap}
.formula em{font-style:normal;color:var(--red-600);font-weight:700}

.cpanum{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px}
.cpanum .big{font-size:34px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;color:var(--red)}
.cpanum .unit{font-size:14px;font-weight:600;color:var(--t2)}
.cpanum .vs{margin-left:auto;font-size:12px;color:var(--t3);text-align:right;line-height:1.6}

.wf{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.wf .wrow{display:grid;grid-template-columns:58px 1fr 74px;align-items:center;gap:11px;padding:7px 0;
  font-size:12.5px;border-bottom:1px dashed var(--line)}
.wf .wrow:last-child{border-bottom:0}
.wf .wrow.head{color:var(--t3);font-size:11.5px;font-weight:600;border-bottom:1px solid var(--line)}
.wf .wlab{color:var(--t2);font-weight:600}
.wf .wbar{height:9px;border-radius:99px;background:#F2F2F5;position:relative;overflow:hidden}
.wf .wbar i{position:absolute;top:0;bottom:0;border-radius:99px;transition:.25s}
.wf .wbar i.p{background:var(--red);left:0}
.wf .wbar i.n{background:var(--green);left:0}
.wf .wval{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.wf .wval.p{color:var(--red-600)}
.wf .wval.n{color:var(--green)}

/* ---------- 打法卡 ---------- */
.kpirow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mini-kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px}
.mini-kpi .l{font-size:12px;color:var(--t2);display:flex;align-items:center;gap:6px}
.mini-kpi .l svg{width:14px;height:14px;color:var(--t3)}
.mini-kpi .v{font-size:23px;font-weight:700;margin-top:7px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.mini-kpi .v small{font-size:13px;font-weight:600;color:var(--t2);margin-left:2px}
.mini-kpi .f{font-size:11.5px;color:var(--t3);margin-top:4px}

.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kcard{border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;background:var(--card);
  box-shadow:var(--sh);transition:.16s;display:flex;flex-direction:column}
.kcard:hover{box-shadow:var(--sh-hover)}
.kcard .kh{display:flex;align-items:flex-start;gap:10px}
.kcard .kh h4{margin:0;font-size:14px;font-weight:600;line-height:1.45}
.kcard .kfields{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.kfield{background:#FAFAFC;border-radius:var(--r-m);padding:10px 12px}
.kfield .lab{font-size:10.5px;color:var(--t3);font-weight:700;margin-bottom:4px;letter-spacing:.4px}
.kfield .txt{font-size:12.5px;color:var(--t2);line-height:1.62}
.kcard .kf{display:flex;align-items:center;gap:11px;margin-top:13px;padding-top:12px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--t3);flex-wrap:wrap}
.kcard .kf .refs{margin-left:auto;font-weight:700;color:var(--red-600)}
.kcard.sm .kfields{grid-template-columns:1fr}
/* 刚沉淀的卡给一圈高亮,和「已沉淀」回执呼应 */
.kcard.fresh{border-color:var(--red);box-shadow:0 0 0 3px var(--red-50),var(--sh-hover)}

/* ---- 打法卡沉淀 ---- */
.forge-cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px;
  padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-l);background:#FAFAFC}
.forge-cta .tx{display:flex;gap:11px;flex:1;min-width:220px;color:var(--red-600)}
.forge-cta .tx span{display:block}
.forge-cta .tx b{display:block;font-size:13px;color:var(--t1);margin-bottom:3px}
.forge-cta .tx em{font-style:normal;font-size:12.5px;color:var(--t3);line-height:1.68}

.forge-done{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;
  padding:13px 16px;border:1px solid var(--red-100);background:var(--red-50);
  border-radius:var(--r-l);animation:pop .2s ease}
.forge-done .ic{display:grid;place-items:center;width:26px;height:26px;border-radius:99px;
  background:var(--red);color:#fff;flex:0 0 auto}
.forge-done .tx{flex:1;min-width:200px}
.forge-done .tx b{display:block;font-size:13px;color:var(--red-700);margin-bottom:3px}
.forge-done .tx span{font-size:12px;color:var(--t2);line-height:1.6}
.forge-done .x{width:24px;height:24px;border-radius:99px;color:var(--t3);display:grid;place-items:center}
.forge-done .x:hover{background:#fff}
.btn-ghost.danger{color:var(--red-600);border-color:var(--red-100)}
.btn-ghost.danger:hover{background:var(--red-50);border-color:var(--red);color:var(--red-700)}
.btn-ghost.danger.armed{background:var(--red);border-color:var(--red);color:#fff}

.fgmodal{max-width:680px}
.fg-src{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t2);
  background:#F7F7FA;border-radius:var(--r-m);padding:9px 12px;margin-bottom:16px}
.fg-src b{color:var(--t1)}
.fg-lb{font-size:12.5px;font-weight:600;color:var(--t1);margin:15px 0 7px;
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.fg-lb .hint{font-size:11.5px;font-weight:400;color:var(--t3)}
.fg-lb.need{color:var(--red-700)}
.fg-lb.need .hint{color:var(--red-600)}
.fg-name{padding:11px 14px;border:1px dashed var(--red-100);border-radius:var(--r-m);
  background:var(--red-50);font-size:13.5px;color:var(--red-700);line-height:1.5;word-break:break-all}
.fg-name i{font-style:normal;color:var(--t3);margin:0 4px}
.fg-compose{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.fg-sel{flex:1;min-width:210px;display:flex;align-items:center;gap:9px;
  border:1px solid var(--line2);border-radius:var(--r-m);padding:7px 11px;background:var(--card)}
.fg-sel span{font-size:11.5px;color:var(--t3);font-weight:600;flex:0 0 auto}
.fg-sel select{flex:1;border:0;background:transparent;font-family:inherit;font-size:12.5px;
  color:var(--t1);outline:none;cursor:pointer;min-width:0}
.fgmodal textarea{width:100%;box-sizing:border-box;border:1px solid var(--line2);border-radius:var(--r-m);
  padding:10px 12px;font-family:inherit;font-size:12.5px;line-height:1.7;color:var(--t1);
  resize:vertical;outline:none;background:var(--card);transition:.14s}
.fgmodal textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
.fgmodal textarea::placeholder{color:var(--t4)}
.fg-note{display:flex;gap:9px;margin-top:9px;font-size:11.5px;color:var(--t3);line-height:1.68}
.fg-note svg{flex:0 0 auto;margin-top:1px}
.fg-tags{display:flex;gap:7px;flex-wrap:wrap}
.fg-tag{font-size:11.5px;padding:4px 10px;border-radius:99px;background:#F2F2F5;color:var(--t2)}
.fg-err{display:none;align-items:flex-start;gap:8px;margin-top:14px;padding:10px 12px;
  border-radius:var(--r-m);background:#FFF1F3;border:1px solid var(--red-100);
  color:var(--red-700);font-size:12.5px;line-height:1.6}
.fg-err svg{flex:0 0 auto;margin-top:2px}
.fg-foot{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:16px;
  border-top:1px solid var(--line);flex-wrap:wrap}
.fg-auto{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--green);
  margin-right:auto;min-width:180px}
.fg-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fg-pair .fg-sel{min-width:0}
/* 独占一行的下拉(负责人):和 .fg-pair 里的两列共用同一套 .fg-sel 观感 */
.fg-sel-full{display:flex;width:100%;max-width:none}
.fg-days{display:flex;gap:8px;flex-wrap:wrap}
.daybtn{font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:var(--r-m);
  border:1px solid var(--line);background:#fff;color:var(--t2);cursor:pointer;font-family:inherit}
.daybtn:hover{border-color:var(--red-100);color:var(--red-700)}
.daybtn.on{background:var(--red);border-color:var(--red);color:#fff}

/* ---- 产品需求 · 第二种沉淀物 ----
   打法卡是红的(行动 / 商家侧),产品需求是蓝的(信息 / 平台侧)。
   同一个断点走哪条出口,颜色上就该一眼分得开 */
.needstrip{display:flex;align-items:flex-start;gap:9px;margin-top:12px;padding:11px 14px;
  border:1px solid #CFDCFF;background:var(--blue-50);border-radius:var(--r-m);
  font-size:12.5px;color:var(--t2);line-height:1.66}
.needstrip + .needstrip{margin-top:8px}
.needstrip > svg{flex:0 0 auto;margin-top:1px;color:var(--blue)}
.needstrip b{color:var(--t1)}
.needstrip .lb{color:var(--blue);font-weight:700}
.needstrip .go{margin-left:auto;flex:0 0 auto;color:var(--blue);font-weight:600;cursor:pointer;white-space:nowrap}
.needstrip .go:hover{text-decoration:underline}
/* 「已登记为产品需求」的回执:和打法卡的回执同款,只换色 */
.forge-done.need{border-color:#CFDCFF;background:var(--blue-50)}
.forge-done.need .ic{background:var(--blue)}
.forge-done.need .tx b{color:#2A55CC}
/* 登记弹窗里的「诊断依据」:这几行是页面算出来的,是提不提这条需求的判据 */
.needev{background:#F7F7FA;border-radius:var(--r-m);padding:4px 12px}
.needev .ev{display:flex;gap:10px;align-items:baseline;padding:8px 0;font-size:12.5px;line-height:1.6}
.needev .ev + .ev{border-top:1px dashed var(--line)}
.needev .ev > span{flex:0 0 62px;color:var(--t3);font-weight:600;font-size:11.5px}
.needev .ev > b{color:var(--t1);font-weight:600}
.needev .ev.hit > b{color:var(--red-600)}
/* 证据够强时给按钮一圈提示:机器也认为这条断点该走平台侧,不是运营在硬凑 */
.btn-ghost.sug{border-color:var(--blue);color:var(--blue);background:var(--blue-50)}
.btn-ghost.sug:hover{border-color:var(--blue);color:#2A55CC;background:#E2EAFF}

/* ---- 投放可持续性 · LTV ÷ CPA。链路末端唯一一个能判「该不该继续加钱」的读数 ---- */
.econ{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.econ.ok{border-color:#CFEBDA;background:#F7FCF9}
.econ.tight{border-color:#FFE0C2;background:#FFFBF6}
.ec-h{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line)}
.ec-h .k{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--t1)}
.ec-h .pill{margin-left:auto}
.ec-b{display:flex;align-items:center;gap:16px;padding:14px 15px}
.ec-fig{display:flex;flex-direction:column;flex:0 0 auto;padding-right:16px;
  border-right:1px solid var(--line);min-width:104px}
.ec-fig .n{font-size:26px;font-weight:800;letter-spacing:-.5px;color:var(--t1);line-height:1.1}
.econ.ok .ec-fig .n{color:var(--green)}
.econ.tight .ec-fig .n{color:var(--red-600)}
.ec-fig .n small{font-size:14px;font-weight:700;margin-left:1px}
.ec-fig .u{font-size:11px;color:var(--t3);margin-top:3px}
.ec-eq{font-size:12.5px;color:var(--t2);line-height:1.7}
.ec-eq em{display:block;font-style:normal;font-size:11.5px;color:var(--t3);margin-top:2px}
.ec-v{display:flex;gap:9px;padding:12px 15px;border-top:1px solid var(--line);
  font-size:12.5px;line-height:1.7;color:var(--t2);background:rgba(255,255,255,.55)}
.ec-v svg{flex:0 0 auto;margin-top:2px;color:var(--t3)}
.ec-v b{color:var(--t1);margin-right:6px}

/* ---- 处置状态条 · 诊断之后那一步的容器,登记过就常驻在链路卡顶部 ---- */
.actbar{margin-top:14px;padding:13px 15px;border:1px solid #D5E0FF;background:#F5F8FF;
  border-radius:var(--r-l)}
.actbar.due{border-color:#FFE0C2;background:#FFFBF6}
.ab-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.ab-id{font-size:11.5px;font-weight:700;color:var(--t2)}
.ab-owner{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  color:var(--t2);background:#fff;border:1px solid #D5E0FF;border-radius:99px;padding:2px 9px}
.ab-owner svg{flex:0 0 auto;color:var(--t3)}
.ab-due{font-size:11.5px;color:var(--t3);margin-left:auto}
.ab-b{font-size:12.5px;line-height:1.75}
.ab-do{color:var(--t1);font-weight:600;margin-bottom:6px}
.ab-m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--t2)}
.ab-m span{font-size:11.5px;color:var(--t3)}
.ab-m b{font-weight:700;color:var(--t2);background:#fff;border:1px solid var(--line);
  border-radius:6px;padding:1px 7px}
.ab-m b.tgt{color:var(--blue);border-color:#D5E0FF}
.ab-m i{font-style:normal;color:var(--t3)}
.ab-g{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t3);margin-top:7px}
.ab-g svg{flex:0 0 auto}
.actbar .btn-solid{margin-top:12px}

/* ---- 助手上下文 · 回答之前先说清「我看了哪些读数」 ---- */
.ctxbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ctxchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  padding:4px 10px;border-radius:99px;border:1px solid #CFEBDA;background:#F7FCF9;
  color:var(--green);cursor:pointer;font-family:inherit}
.ctxchip.off{border-color:#FFE0C2;background:#FFFBF6;color:#D97A00}
.ctxhint{font-size:11.5px;color:var(--t3)}
.ctxblk{margin-bottom:11px;padding:11px 13px;border-radius:var(--r-m);
  background:#F7F7FA;border:1px solid var(--line)}
.ctxblk .tag{display:inline-flex;align-items:center;gap:5px;margin:0 0 6px;font-size:11px;
  font-weight:700;color:var(--t3);letter-spacing:.2px}
.ctxblk .bd{font-size:12.5px;line-height:1.8;color:var(--t2)}
.ctxblk .bd b{color:var(--t1)}

/* ---- 知识库卡片 · 命中同类断点的商家名单 ---- */
.khits{margin-top:12px}
.hits-btn{display:flex;align-items:center;gap:7px;width:100%;padding:9px 11px;text-align:left;
  border:1px solid var(--line);border-radius:var(--r-m);background:#FAFAFB;
  font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;font-family:inherit}
.hits-btn:hover{border-color:var(--red-100);color:var(--red-700);background:var(--red-50)}
.hits-btn.on{border-color:var(--red-100);background:var(--red-50);color:var(--red-700);
  border-bottom-left-radius:0;border-bottom-right-radius:0}
.hits-btn b{color:var(--red-600)}
.hits-btn .chev{margin-left:auto;display:flex;transition:transform .18s}
.hits-btn.on .chev{transform:rotate(180deg)}
.hits-list{display:flex;flex-wrap:wrap;gap:6px;padding:11px;background:var(--red-50);
  border:1px solid var(--red-100);border-top:0;border-radius:0 0 var(--r-m) var(--r-m)}
.hchip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:#fff;
  border:1px solid var(--red-100);color:var(--red-700);cursor:pointer;white-space:nowrap}
.hchip:hover{background:var(--red);border-color:var(--red);color:#fff}
.hits-note{width:100%;font-size:11.5px;font-weight:400;color:var(--t3);margin-top:2px}

/* ---- 大盘建议可点 / 诊断页层内位次可点 ---- */
.advice{display:flex;gap:9px;margin-bottom:12px;padding:9px 11px;border-radius:var(--r-m);
  border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s}
.advice:last-child{margin-bottom:0}
.advice:hover{background:#FAFAFB;border-color:var(--line)}
.advice svg{flex:0 0 auto;margin-top:2px}
.advice .go{display:inline-flex;align-items:center;gap:3px;margin-left:8px;font-size:12px;
  font-weight:600;color:var(--red-600);white-space:nowrap}
.advice:hover .go{color:var(--red-700)}
.lnk{color:var(--red-600);font-weight:600;cursor:pointer;
  border-bottom:1px dashed var(--red-100)}
.lnk:hover{color:var(--red-700);border-bottom-color:var(--red)}

/* ---- 口径说明 · 分母不同就不能相除,写清楚比让人猜好 ---- */
.scopenote{display:flex;gap:10px;margin-top:14px;padding:14px 16px;border-radius:var(--r-l);
  background:#FAFAFB;border:1px solid var(--line);font-size:12.5px;line-height:1.8;color:var(--t2)}
.scopenote svg{flex:0 0 auto;margin-top:3px;color:var(--t3)}
.scopenote b{color:var(--t1)}
.scopenote .mt{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
@media (max-width:560px){
  .fg-sel{min-width:100%}
  .fg-foot .btn-ghost,.fg-foot .btn-solid{flex:1}
  .fg-auto{min-width:100%;margin-bottom:2px}
  .kcard .kfields{grid-template-columns:1fr}
  .fg-pair{grid-template-columns:1fr}
  .daybtn{flex:1}
  /* 比值数字单独占一行,等式和判断跟在后面,避免窄屏把数字挤成两行 */
  .ec-b{flex-direction:column;align-items:stretch;gap:12px}
  .ec-fig{flex-direction:row;align-items:baseline;gap:8px;padding:0 0 12px;
    border-right:0;border-bottom:1px solid var(--line);min-width:0}
  .ec-fig .u{margin-top:0}
  .ab-due{margin-left:0}
  .actbar .btn-solid{width:100%}
}

.rank{display:flex;flex-direction:column;gap:2px}
.rankrow{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line)}
.rankrow:last-child{border-bottom:0}
.rankrow .no{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;
  font-weight:700;background:#F2F2F5;color:var(--t2);flex:0 0 22px}
.rankrow .no.top{background:var(--red);color:#fff}
.rankrow .nm{font-size:13px;font-weight:600}
.rankrow .cnt{margin-left:auto;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rankrow .sub{font-size:11.5px;color:var(--t3)}

/* ---------- AI 助手 ---------- */
.chat{display:flex;flex-direction:column;gap:13px;padding:4px 2px;min-height:190px;max-height:520px;overflow-y:auto}
.msg{display:flex;gap:10px;max-width:92%}
.msg .av{width:28px;height:28px;border-radius:99px;flex:0 0 28px;display:grid;place-items:center}
.msg .av svg{width:15px;height:15px}
.msg .bub{background:#F5F5F7;border-radius:14px;padding:11px 14px;font-size:13px;line-height:1.75;
  color:var(--t1);word-break:break-word}
.msg .bub .cite{display:block;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line2);
  font-size:12px;color:var(--t2)}
.msg .bub .cite b{color:var(--red-600)}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.msg.me .bub{background:var(--red);color:#fff;border-radius:14px}
.msg.ai .av{background:linear-gradient(135deg,var(--red),#FF5C4D);color:#fff;flex-direction:column}

.composer{display:flex;gap:9px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.composer input{flex:1;border:1px solid var(--line2);border-radius:99px;padding:10px 16px;font-size:13px;
  outline:0;background:#FAFAFC;transition:.15s;font-family:inherit}
.composer input:focus{border-color:var(--red);background:var(--card)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip-q{font-size:12px;color:var(--t2);background:var(--card);border:1px solid var(--line2);
  border-radius:99px;padding:6px 13px;transition:.15s;text-align:left}
.chip-q:hover{border-color:var(--red);color:var(--red-600);background:var(--red-50)}

.hit{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:var(--r-m);
  border:1px solid var(--line);margin-bottom:8px;font-size:12.5px;transition:.15s;cursor:pointer}
.hit:hover{background:#FAFAFC;border-color:var(--line2)}
.hit .sc{font-size:11px;font-weight:700;color:var(--red-600);background:var(--red-50);
  padding:3px 8px;border-radius:99px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.hit .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .src{margin-left:auto;font-size:11px;color:var(--t3);flex:0 0 auto}
.hit.low{opacity:.6}

.quick{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}

/* ---------- 商家搜索 ---------- */
.msearch{position:relative;width:216px}
.msearch .ms-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);display:flex;pointer-events:none}
.msearch .ms-ico svg{width:15px;height:15px}
.msearch input{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:99px;
  padding:7px 14px 7px 33px;font-size:13px;outline:0;transition:.15s;font-family:inherit;color:var(--t1)}
.msearch input::placeholder{color:var(--t4)}
.msearch input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,36,66,.08)}
.ms-drop{position:absolute;top:calc(100% + 6px);right:0;width:308px;background:var(--card);
  border:1px solid var(--line2);border-radius:var(--r-m);box-shadow:0 12px 32px rgba(22,22,32,.14);
  padding:5px;display:none;max-height:344px;overflow-y:auto;z-index:60}
.ms-drop.on{display:block}
.ms-hd{font-size:11px;color:var(--t4);padding:7px 11px 4px;font-weight:600}
.ms-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;cursor:pointer;transition:.13s}
.ms-item:hover{background:#F7F7F9}
.ms-item.on{background:var(--red-50)}
.ms-name{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-name b{color:var(--red-600);font-weight:700}
.ms-spend{font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums;flex:0 0 auto}
.ms-empty{padding:16px;text-align:center;font-size:12.5px;color:var(--t3)}

/* ---------- 悬浮助手 + 右侧抽屉 ---------- */
.fab{position:fixed;right:26px;bottom:26px;z-index:70;width:52px;height:52px;border-radius:99px;
  background:linear-gradient(135deg,var(--red),#FF5C4D);color:#fff;display:grid;place-items:center;
  box-shadow:0 6px 20px rgba(255,36,66,.36),0 0 0 3px #fff;transition:.18s}
.fab:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(255,36,66,.44)}
.fab svg{width:22px;height:22px}
.fab .fab-tip{position:absolute;right:62px;top:50%;transform:translateY(-50%);white-space:nowrap;
  background:var(--t1);color:#fff;font-size:12px;padding:6px 11px;border-radius:8px;
  opacity:0;pointer-events:none;transition:.16s}
.fab:hover .fab-tip{opacity:1}

.dw-mask{position:fixed;inset:0;background:rgba(20,20,28,.26);z-index:88;
  opacity:0;pointer-events:none;transition:.22s}
.dw-mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:100vw;background:var(--card);z-index:90;
  border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  box-shadow:-12px 0 40px rgba(22,22,32,.10)}
.drawer.on{transform:none}
.dw-h{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dw-h .mk{width:30px;height:30px;border-radius:10px;flex:0 0 30px;color:#fff;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--red),#FF5C4D)}
.dw-h .mk svg{width:16px;height:16px}
.dw-h .ti{min-width:0}
.dw-h .ti strong{display:block;font-size:13.5px;font-weight:600}
.dw-h .ti span{display:block;font-size:11px;color:var(--t3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dw-h .x{margin-left:auto;width:30px;height:30px;border-radius:99px;display:grid;place-items:center;
  color:var(--t2);flex:0 0 30px}
.dw-h .x:hover{background:#F2F2F5}
.dw-body{flex:1;overflow-y:auto;padding:16px}
/* 回答下方的「检索明细」展开按钮 —— 明细挂在它所属的那条回答上,而不是全局分页签 */
.cite-btn{display:flex;align-items:center;gap:7px;width:100%;margin-top:12px;padding:7px 11px;
  border:1px solid var(--line2);background:#FAFAFC;border-radius:9px;font-size:12px;
  color:var(--t2);font-family:inherit;transition:.14s}
.cite-btn:hover{background:#F4F4F7;border-color:var(--t3)}
.cite-btn.on{background:var(--red-50);border-color:var(--red-100);color:var(--red-700)}
.cite-btn .pct{color:var(--t3);font-size:11.5px;font-variant-numeric:tabular-nums}
.cite-btn.on .pct{color:var(--red-600)}
.cite-btn .cv{margin-left:auto;display:flex;color:var(--t3);transition:transform .18s}
.cite-btn.on .cv{transform:rotate(180deg)}
.hitbox{margin-top:10px;padding:12px;background:#FAFAFC;border:1px solid var(--line);border-radius:10px}
.dw-foot{flex:0 0 auto;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line)}
.drawer .chat{max-height:none;min-height:0}
.drawer .composer{margin-top:0;padding-top:0;border-top:0}

/* responsive */
.mobile-nav{display:none}
@media (max-width:1020px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
  .triple{grid-template-columns:1fr}
}
@media (max-width:820px){
  .sidebar{display:none}
  .main{margin-left:0}
  .view{padding:16px 14px 92px}
  .topbar{padding:0 14px;height:54px}
  .topbar .sub{display:none}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:13px 14px}
  .kpi .val{font-size:22px}
  .kpi .spark{display:none}
  .mobile-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.94);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .mobile-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--t3);font-size:10.5px;font-weight:500;border-radius:12px}
  .mobile-nav a svg{width:20px;height:20px}
  .mobile-nav a.on{color:var(--red)}
  /* 窄屏:让标题行的说明文字可换行,去掉告警行里最占位的次要信息 */
  .sec-title{flex-wrap:wrap;line-height:1.6}
  .sec-title .hint{font-size:11.5px;flex-basis:100%}
  /* 窄屏:链路改为纵向,箭头旋转向下,转化率贴在两段之间 */
  .journey{flex-direction:column;overflow:visible;padding:0}
  .jstep{flex:0 0 auto;width:100%;flex-direction:row;align-items:center;gap:12px;padding:11px 2px;
    text-align:left}
  .jstep .ico{margin-bottom:0;width:36px;height:36px;flex:0 0 36px;border-radius:11px}
  .jstep .name{margin-bottom:0;font-size:13px}
  .jstep .num{margin-left:auto;font-size:18px}
  .jstep .note{margin:0 0 0 8px;flex:0 0 auto;font-size:11px}
  /* 纵向链路:箭头改成向下,左内距 8 + 箭头半宽 12 = 20,正好是 36px 图标块的中线 */
  .jlink{flex:0 0 auto;width:100%;flex-direction:row;align-items:center;gap:8px;
    padding:0 0 0 8px;justify-content:flex-start}
  .jlink .arrow{width:24px;height:24px;flex:0 0 24px;align-items:center;justify-content:center}
  .jlink .arrow svg{width:24px;height:24px;transform:rotate(90deg)}
  .jlink .rate{font-size:11.5px}
  .jlink .drop{font-size:11px}
  .alert{gap:9px;padding:11px 4px}
  .alert .time{display:none}
  .alert .who{font-size:13px}
  .alert .what{font-size:12px}
  .kpi .val{font-size:21px}
  /* 窄屏:隐藏次要列,表格仍可横向滚动 */
  .hide-sm{display:none}
  .tbl{min-width:500px}
  .kpirow{grid-template-columns:1fr 1fr;gap:10px}
  .duo{grid-template-columns:1fr}
  .kgrid{grid-template-columns:1fr}
  .cpa-grid{grid-template-columns:1fr;gap:14px}
  .kcard .kfields{grid-template-columns:1fr}
  .alert .who{font-size:12.5px}
  .btn-ghost{font-size:12px;padding:6px 12px}
  /* 窄屏:悬浮助手全宽,按钮抬到底部导航之上 */
  .drawer{width:100%}
  .fab{right:14px;bottom:calc(76px + env(safe-area-inset-bottom));width:48px;height:48px}
  .fab .fab-tip{display:none}
  .msearch{width:150px}
  .msearch input{font-size:12.5px;padding:6px 12px 6px 31px}
  .ms-drop{width:min(308px,calc(100vw - 28px))}
  .drawer .chat{max-height:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" id="brandMark"></div>
      <div class="brand-txt">
        <strong>商家经营 CRM</strong>
        <span>商业化平台侧</span>
      </div>
    </div>
    <div class="nav-label">工作台</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <button class="about-btn" onclick="openMatrix()">
        <span id="aboutIco"></span><span>本作品的产品定位</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">商业化大盘</h1>
      <span class="sub" id="pageSub"></span>
      <div class="topbar-right">
        <div class="msearch" id="msearch">
          <span class="ms-ico" id="msIco"></span>
          <input id="msInput" placeholder="搜索商家" autocomplete="off" spellcheck="false"
                 oninput="onMerchantSearch()" onfocus="onMerchantSearch()">
          <div class="ms-drop" id="msDrop"></div>
        </div>
        <button class="icon-btn" title="待处理告警"><span id="icoBell"></span><i class="pip"></i></button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </div>

  <nav class="mobile-nav" id="mnav"></nav>
</div>

<!-- ===== 悬浮运营助手(全站可用,不随页面重渲染) ===== -->
<div class="dw-mask" id="dwMask" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="dw-h">
    <span class="mk" id="dwMk"></span>
    <span class="ti"><strong>运营助手</strong><span id="dwCtx">基于知识库检索</span></span>
    <button class="x" onclick="closeDrawer()" title="关闭">✕</button>
  </div>
  <div class="dw-body">
    <div class="quick" id="dwQuick"></div>
    <div class="chat" id="chatlog"></div>
  </div>
  <div class="dw-foot">
    <div class="ctxbar" id="dwCtxBar"></div>
    <div class="chips" id="dwChips"></div>
    <div class="composer">
      <input id="qin" placeholder="提问,例如:搜索转化率下滑怎么排查?" onkeydown="if(event.key==='Enter')askInput()">
      <button class="btn-solid" onclick="askInput()">发送</button>
    </div>
  </div>
</aside>
<button class="fab" id="fab" onclick="openDrawer()" title="运营助手">
  <span id="fabIco"></span><span class="fab-tip">运营助手</span>
</button>

<script>
/* =========================================================
   图标系统 · 全部内联 SVG,零外部依赖
   设计原则:每个图标对应"用户旅程链路"上的一个环节,
   形状上刻意做成可串联的一族(圆角、统一线宽、统一视框)
   ========================================================= */
const ICONS = {
  /* 旅程链路图标族 */
  exposure : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3.1"/>',
  click    : '<path d="M8.5 2.5v3M3 8h3M4.3 4.3l2.1 2.1"/><path d="M9.2 9.2l10.6 4.6-4.7 1.5-1.5 4.7-4.4-10.8z"/>',
  cart     : '<circle cx="9.4" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2.2 3h2.9l2.7 12.3a1.9 1.9 0 001.9 1.5h7.9a1.9 1.9 0 001.9-1.5L21 7.2H6"/>',
  deal     : '<path d="M4.5 2.6h15v18.8l-2.9-1.9-2.2 1.9-2.4-1.9-2.4 1.9-2.2-1.9-2.9 1.9z"/><path d="M8.4 8.2h7.2M8.4 12.1h4.8"/>',
  repeat   : '<path d="M17 2.4l3.6 3.6L17 9.6"/><path d="M3.4 11.2V9.6a3.6 3.6 0 013.6-3.6h13.6"/><path d="M7 21.6L3.4 18 7 14.4"/><path d="M20.6 12.8v1.6a3.6 3.6 0 01-3.6 3.6H3.4"/>',
  ltv      : '<path d="M6.4 2.8h11.2l4 6.4L12 21.6 2.4 9.2l4-6.4z"/><path d="M2.4 9.2h19.2M12 21.6L8 9.2l2.2-6.4M12 21.6l4-12.4-2.2-6.4"/>',
  /* 广告主生命周期图标族 */
  onboard  : '<path d="M14.6 3h4.2a1.2 1.2 0 011.2 1.2v15.6a1.2 1.2 0 01-1.2 1.2h-4.2"/><path d="M9.8 16.6L14.4 12 9.8 7.4"/><path d="M14.4 12H3.2"/>',
  firstad  : '<circle cx="12" cy="12" r="9.2"/><path d="M10 8.2l6.2 3.8L10 15.8z"/>',
  'scale-up': '<path d="M3 17.2l5.8-5.8 3.8 3.8L21 6.6"/><path d="M15.2 6.6H21v5.8"/>',
  renew    : '<path d="M12 2.6l9 4.8-9 4.8-9-4.8 9-4.8z"/><path d="M3 12.2l9 4.8 9-4.8"/><path d="M3 16.9l9 4.8 9-4.8"/>',
  expand   : '<path d="M5.5 13.5L12 10l6.5 3.5"/><path d="M4.6 17.1L12 21l7.4-3.9"/><path d="M12 3v9.4"/><path d="M8.7 6.1L12 3l3.3 3.1"/>',
  /* 导航 */
  dashboard: '<rect x="3" y="3" width="7.6" height="7.6" rx="2"/><rect x="13.4" y="3" width="7.6" height="7.6" rx="2"/><rect x="3" y="13.4" width="7.6" height="7.6" rx="2"/><rect x="13.4" y="13.4" width="7.6" height="7.6" rx="2"/>',
  store    : '<path d="M4 10.2v9.4a1.4 1.4 0 001.4 1.4h13.2a1.4 1.4 0 001.4-1.4v-9.4"/><path d="M2.6 6.4l1.3-3.5h16.2l1.3 3.5a3.05 3.05 0 01-5.9.7 3.1 3.1 0 01-6.1 0 3.05 3.05 0 01-5.9-.7z"/><path d="M9.4 21v-5.4h5.2V21"/>',
  pulse    : '<path d="M3 12h3.8l2.6-8.4L13 20.4l2.5-8.4H21"/>',
  book     : '<path d="M4.2 19.4A2.6 2.6 0 016.8 16.8H20"/><path d="M6.8 2.4H20v18.8H6.8a2.6 2.6 0 01-2.6-2.6V5a2.6 2.6 0 012.6-2.6z"/>',
  sparkle  : '<path d="M11.2 2.6l1.9 5.2 5.2 1.9-5.2 1.9-1.9 5.2-1.9-5.2-5.2-1.9 5.2-1.9 1.9-5.2z"/><path d="M18.6 15.4l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/>',
  /* 运营助手 · 机器人(天线 + 头部 + 侧耳,眼睛用实心点保证小尺寸下可辨识) */
  robot    : '<path d="M12 5.6V3.3"/><circle cx="12" cy="2.05" r="1.15" fill="currentColor" stroke="none"/>'
           + '<rect x="3.8" y="5.6" width="16.4" height="14" rx="3.8"/>'
           + '<path d="M3.8 11.2H2.1v3.6h1.7M20.2 11.2h1.7v3.6h-1.7"/>'
           + '<circle cx="9.2" cy="11.6" r="1.35" fill="currentColor" stroke="none"/>'
           + '<circle cx="14.8" cy="11.6" r="1.35" fill="currentColor" stroke="none"/>'
           + '<path d="M9.4 15.9h5.2"/>',
  /* 语义 */
  alert    : '<path d="M10.3 3.9L1.9 18.1a2 2 0 001.7 3h16.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9.2v4M12 17.2h.01"/>',
  arrowR   : '<path d="M4.6 12h14.2M12.6 5.6L19 12l-6.4 6.4"/>',
  /* 漏斗连接件专用:横线画满整个 viewBox,箭头的**尖端正好落在横线的端点**上(21,12),
     上下各留 5.6 —— 原来看起来「歪」就是因为尖端在 19、横线到 18.8,差半像素就显歪。 */
  arrowLn  : '<path d="M2 12h19M16 6.4L21 12l-5 5.6"/>',
  chevDown : '<path d="M5.6 8.8L12 15.2l6.4-6.4"/>',

function icon(name, size){
  size = size || 20;
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" '
       + 'stroke-linecap="round" stroke-linejoin="round" width="'+size+'" height="'+size+'">'
       + (ICONS[name] || '') + '</svg>';
}
/* 旅途箭头:带转化率的连接段。
   顺序是「箭头 → 转化率 → 流失数」,箭头放在第一行并固定 40px(等于图标块高度),
   于是所有连接件都落在和图标同一个水平线上;转化率作为它的读数挂在下面。
   之前箭头夹在中间、用 padding-top 去凑位置,是它看起来歪的直接原因。 */
function jlink(rate, dropLabel, tone){
  const color = tone === 'bad' ? 'var(--red)' : tone === 'warn' ? '#D97A00' : 'var(--t2)';
  return '<div class="jlink">'
    + '<div class="arrow">'+icon('arrowLn',26)+'</div>'
    + '<div class="rate" style="color:'+color+'">'+rate+'</div>'
    + (dropLabel ? '<div class="drop">'+dropLabel+'</div>' : '')
    + '</div>';
}
function jstep(ic, name, num, note, hot){
  return '<div class="jstep'+(hot?' hot':'')+'">'
    + '<div class="ico">'+icon(ic,20)+'</div>'
    + '<div class="name">'+name+'</div>'
    + '<div class="num">'+num+'</div>'
    + (note?'<div class="note">'+note+'</div>':'')
    + '</div>';
}
/* 迷你 sparkline */
function spark(pts, color){
  const w=104,h=44,max=Math.max.apply(null,pts),min=Math.min.apply(null,pts);
  const rng=(max-min)||1;
  const d=pts.map(function(v,i){
    const x=(i/(pts.length-1))*(w-8)+4;
    const y=h-6-((v-min)/rng)*(h-16);
    return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);
  }).join(' ');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'
    + '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>'
    + '</svg>';
}
function delta(v, txt){
  const cls = v>0?'up':v<0?'down':'flat';
  const sym = v>0?'▲':v<0?'▼':'—';
  return '<span class="delta '+cls+'">'+sym+' '+(txt||Math.abs(v)+'%')+'</span>';
}

const TIER_NEW_DAYS = 90;    // 入驻 ≤90 天 → 新客期
const TIER_MOM_FLAT = 3;     // 消耗环比 ±3% 以内视为「基本持平」

/* ---- 健康度评分模型 ----
   取四个**平台侧可直接观测**的指标,各自映射成 0~100 的分项分,再加权合成。
   权重按「对经营结果的解释力」定:ROAS 最重(它直接就是投放回报),
   广告负反馈率次之(它是生态护栏,越线会被限流,再高的 ROAS 也守不住),
   素材审核驳回率与复购率各占两成。
   **刻意不含「消耗环比」** —— 环比已经是分层的判据,再拿它算健康度,
   两根轴就共线了,「成长期但健康度报警」这种交叉视角会直接消失。
   分项分用**分档线性插值**、两端截断,而不是连续外推:
   单个指标爆表不该把总分一路打到 0,那样一条负反馈率就能盖掉其余三项。 */
const HEALTH_OK   = 75;   // ≥75 → 健康
const HEALTH_RISK = 55;   // <55 → 风险(同时也是列表「只看风险」的筛选线,两处必须同源)
const HEALTH_W = { roas:0.35, neg:0.25, rej:0.20, rep:0.20 };
/* 分档锚点 [指标值, 分项分]。类目中位那一档统一记 70 上下,便于解释 */
const H_ROAS = [[1.00,20],[1.50,45],[2.20,70],[3.00,90],[3.50,100]];
const H_NEG  = [[0.20,95],[0.45,82],[0.62,70],[0.80,55],[1.20,25]];  // 越低越好
const H_REJ  = [[1.0,95],[3.0,82],[5.0,70],[9.0,55],[15.0,25]];      // 越低越好
const H_REP  = [[10,20],[18,40],[26,60],[34,80],[45,100]];
const CLASS_MEDIAN = { roas:'2.20', neg:'0.62%', rej:'5%', rep:'26%' };
const NEG_LIMIT    = '0.80%';   // 生态护栏阈值,与大盘「用户侧」那一列同一个数

function pw(x, pts){
  if(x <= pts[0][0]) return pts[0][1];
  const last = pts[pts.length-1];
  if(x >= last[0]) return last[1];
  for(let i=0;i<pts.length-1;i++){
    const a = pts[i], b = pts[i+1];
    if(x >= a[0] && x <= b[0]) return a[1] + (b[1]-a[1])*(x-a[0])/(b[0]-a[0]);
  }
  return pts[0][1];
}
function healthParts(m){
  return { roas:pw(m.roas,H_ROAS), neg:pw(m.negRate,H_NEG),
           rej :pw(m.rejRate,H_REJ), rep:pw(m.repRate,H_REP) };
}
function healthOf(m){
  const p = healthParts(m);
  return Math.round(HEALTH_W.roas*p.roas + HEALTH_W.neg*p.neg
                  + HEALTH_W.rej*p.rej   + HEALTH_W.rep*p.rep);
}
/* 四个分项分各自摊开 —— 悬停健康度可见,和分层标签的 tierWhy 是同一套思路 */
function healthWhy(m){
  const p = healthParts(m);
  return '健康度 '+m.health+' 由四项加权算出:'
       + ' ROAS '+m.roas.toFixed(2)+' → '+p.roas.toFixed(0)+' 分 ×35%'
       + ' · 广告负反馈率 '+m.negRate.toFixed(2)+'% → '+p.neg.toFixed(0)+' 分 ×25%'
       + ' · 素材审核驳回率 '+m.rejRate.toFixed(1)+'% → '+p.rej.toFixed(0)+' 分 ×20%'
       + ' · 复购率 '+m.repRate+'% → '+p.rep.toFixed(0)+' 分 ×20%';
}
function tierOf(m){
  if(m.days <= TIER_NEW_DAYS) return '新客期';
  if(m.mom >  TIER_MOM_FLAT)  return '成长期';
  if(m.mom < -TIER_MOM_FLAT)  return '衰退期';
  return '成熟期';
}
/* 为什么这家在这层 —— 悬停分层标签时给出的推导过程,让规则可被逐条核对而不是只能相信 */
function tierWhy(m){
  const mom = (m.mom>=0?'+':'') + m.mom.toFixed(1) + '%';
  if(m.days <= TIER_NEW_DAYS)
    return '入驻 '+m.days+' 天（≤'+TIER_NEW_DAYS+'）→ 新客期 （先按阶段兜住，不看环比）';
  if(m.mom > TIER_MOM_FLAT)
    return '入驻 '+m.days+' 天 · 消耗环比 '+mom+'（&gt; +'+TIER_MOM_FLAT+'%）→ 成长期';
  if(m.mom < -TIER_MOM_FLAT)
    return '入驻 '+m.days+' 天 · 消耗环比 '+mom+'（&lt; −'+TIER_MOM_FLAT+'%）→ 衰退期';
  return '入驻 '+m.days+' 天 · 消耗环比 '+mom+'（在 ±'+TIER_MOM_FLAT+'% 之间）→ 成熟期';
}

/* ---------- 手法卡库的本地持久化 ----------
   演示环境是纯前端单文件,没有后端可写。用 localStorage 承载两样东西:
   1) 运营在诊断页新沉淀的卡片(只有这部分需要存,初始语料恒定)
   2) 每张卡的累计被引用次数
   刷新/切换页面都不丢,配合页面上的「重置演示数据」可回到初始状态。 */
const LS_CARDS = 'xhs_crm_cards_v1';
const LS_REFS  = 'xhs_crm_refs_v1';
const KB_TODAY = '2026-10-14';

function lsGet(k){
  try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; }
}
function lsSet(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ /* 隐私模式下静默降级为内存态 */ }
}

/* 卡片数组以「本地新卡在前、初始语料在后」的顺序组装,新建的卡在知识库里一眼可见 */
function loadCards(){
  const mine = lsGet(LS_CARDS);
  /* 种子卡逐个克隆后并入,保证 CARDS_SEED 只是一份模板,不会被运行时改动污染 */
  return (Array.isArray(mine) ? mine : [])
    .concat(CARDS_SEED.map(function(c){ return Object.assign({}, c); }));
}
function saveCards(){
  lsSet(LS_CARDS, CARDS.filter(function(c){ return c.mine; }));
}

/* ---- 通用小组件 ---- */
const TIER_BG = { '新客期':'var(--blue-50)', '成长期':'var(--green-50)', '成熟期':'var(--purple-50)', '衰退期':'var(--red-50)' };
const TIER_FG = { '新客期':'var(--blue)', '成长期':'var(--green)', '成熟期':'var(--purple)', '衰退期':'var(--red-600)' };

function healthColor(v){ return v>=75 ? 'var(--green)' : v>=55 ? 'var(--orange)' : 'var(--red)'; }
/* 传了 why 就把四个分项分挂上去,悬停可见 —— 健康度因此是可拆解、可核对的,不是一个黑箱数字 */
function healthBar(v, why){
  return '<div class="health'+(why?' why':'')+'"'+(why?' title="'+why+'" data-why="'+why+'"':'')+'>'
       + '<div class="bar"><i style="width:'+v+'%;background:'+healthColor(v)+'"></i></div>'
       + '<span class="v" style="color:'+healthColor(v)+'">'+v+'</span></div>';
}
/* 分层口径 —— 默认收起,点标题才展开。展开状态放在 state 里,切分层不会自己合上。

function tierNote(){

    +   '<div class="rl">'
    +     '<span class="st">3</span>入驻 &gt;'+TIER_NEW_DAYS+' 天,环比在 <b>−'+TIER_MOM_FLAT+'% ~ +'+TIER_MOM_FLAT+'%</b> → <b>成熟期</b></div>'
    +   '<div class="rl">'
    +     '<span class="st">4</span>入驻 &gt;'+TIER_NEW_DAYS+' 天,消耗环比 <b>&lt; −'+TIER_MOM_FLAT+'%</b> → <b>衰退期</b></div>'
    +   '<div class="ft">判据只有「入驻天数」和「消耗环比」两个字段,分层是实时算出来的,不是人工打的标签 —— '
    +     '悬停商家列表里任一分层标签,可以看到这家具体是按哪一步落进来的。<br>'

/* 传了商家就带上「为什么在这层」的推导,悬停可见 —— 分层规则因此是可核对的,不是黑箱 */

/* =========================================================
   页2 · 商家管理
   ========================================================= */
function pageMerchants(){
  const f = state.tier;
  /* 两个筛选条件叠加:tab 选生命周期段(纵轴),芯片选健康度线以下(横轴)。
     这正说明分层没有吞掉风险信息——风险被拆成独立一根轴,可以单独用,也可以交叉用。 */
  const riskOnly = !!state.riskOnly;
  const hitRisk  = function(m){ return m.health < HEALTH_RISK; };
  const inTier   = function(m,t){ return (t==='全部' || m.tier===t) && (!riskOnly || hitRisk(m)); };
  const list = MERCHANTS.filter(function(m){ return inTier(m, f); });

  let tabs = ['全部'].concat(TIERS).map(function(t){
    const n = MERCHANTS.filter(function(m){ return inTier(m,t); }).length;
    return '<button class="tab'+(t===f?' on':'')+'"'
         + (TIER_FULL[t] ? ' title="'+TIER_FULL[t]+'"' : '')
         + ' onclick="setTier(\''+t+'\')">'+t
         + '<span class="n">'+n+'</span></button>';
  }).join('');
  /* 芯片计数按当前选中的生命周期段算,这样上面挂的数字和下面的行数永远对得上。
     **始终渲染**,哪怕这一层一个风险商家都没有 —— 控件忽隐忽现会让人以为筛选功能没了;
     计数为 0 时只是变淡,点下去会给出「这一层整体健康」的空态,本身就是个结论。 */
  const riskN = MERCHANTS.filter(function(m){ return (f==='全部' || m.tier===f) && hitRisk(m); }).length;
  tabs += '<button class="riskchip'+(riskOnly?' on':'')+(riskN?'':' zero')+'"'
        + ' title="筛出状态为「风险」的商家(健康度 &lt;'+HEALTH_RISK+')。'
        + '健康度是独立于生命周期的第二根轴,可以和任意分层交叉'
        + (riskN ? '' : ';当前分层下没有风险商家')+'"'
        + ' onclick="toggleRisk()">'+icon('alert',13)
        + '<span>只看风险 · 健康度 &lt;'+HEALTH_RISK+'</span><span class="n">'+riskN+'</span></button>';

  /* 顶部看板跟随选中的分层:
     全部 → 各分层的消耗分布;选中某一层 → 该层内部按商家的消耗结构(TOP 5 + 其他) */
  let boardBar, boardLeg, boardTitle, boardDesc;

  if(f === '全部'){
    /* 看板的口径跟着筛选走,所以条上每一段的宽度和下面图例、和列表行数始终同一套数 */
    const totalSpend = list.reduce(function(s,m){return s+m.spend;},0);
    const byTier = TIERS.map(function(t){
      const arr = list.filter(function(m){return m.tier===t;});
      const sp = arr.reduce(function(s,m){return s+m.spend;},0);
      return { t:t, n:arr.length, spend:sp, pct: totalSpend ? sp/totalSpend*100 : 0 };
    });
    boardBar = byTier.map(function(b){
      return '<i style="width:'+b.pct.toFixed(1)+'%;background:'+TIER_COLOR[b.t]+'" title="'+b.t+'"></i>';
    }).join('');
    boardLeg = byTier.map(function(b){
      return '<span class="seg"><span class="d" style="background:'+TIER_COLOR[b.t]+'"></span>'+b.t
           + ' <b>'+b.n+'</b> 家 · 消耗 <b>'+b.spend.toFixed(1)+'</b> 万 · 占比 <b>'+b.pct.toFixed(1)+'%</b></span>';
    }).join('');
    boardTitle = '客户分层与消耗结构';
    boardDesc  = '按生命周期分四段 · 互斥且穷尽 · 点击分层标签下钻'
               + (riskOnly ? ' · <b style="color:var(--red-600)">已筛：风险商家（健康度 &lt;'+HEALTH_RISK+'）</b>' : '');
  } else {
    const arr = list.slice().sort(function(a,b){ return b.spend-a.spend; });
    const total = arr.reduce(function(s,m){ return s+m.spend; }, 0);
    const top   = arr.slice(0, TIER_TOP_N);
    const rest  = arr.slice(TIER_TOP_N);
    const restSpend = rest.reduce(function(s,m){ return s+m.spend; }, 0);
    const ramp  = TIER_RAMP[f] || TIER_RAMP['新客期'];

    const segs = top.map(function(m,i){
      return { name:m.name, spend:m.spend, pct:m.spend/total*100,
               color:ramp[i] || ramp[TIER_TOP_N-1], mch:m.name };
    });
    if(rest.length){
      segs.push({ name:'其他 '+rest.length+' 家', spend:restSpend,
                  pct:restSpend/total*100, color:SEG_OTHER });
    }

    boardBar = segs.map(function(s){
      return '<i style="width:'+s.pct.toFixed(1)+'%;background:'+s.color+'" title="'+s.name+'"></i>';
    }).join('');
    /* TOP 5 可点击直接下钻到该商家的诊断;「其他」是聚合项,不可点 */
    boardLeg = segs.map(function(s){
      return '<span class="seg'+(s.mch?' click':'')+'"'
           + (s.mch ? ' onclick="openMerchant(\''+s.mch+'\')"' : '') + '>'
           + '<span class="d" style="background:'+s.color+'"></span>'+s.name
           + ' · 消耗 <b>'+s.spend.toFixed(1)+'</b> 万 · 占比 <b>'+s.pct.toFixed(1)+'%</b></span>';
    }).join('');
    boardTitle = f + ' 消耗结构';
    boardDesc  = '该层消耗 TOP '+top.length+' 商家'
               + (rest.length ? ',其余 '+rest.length+' 家归入「其他」' : '')
               + ' · 点击可查看该商家诊断'
               + (riskOnly ? ' · <b style="color:var(--red-600)">已筛：风险商家（健康度 &lt;'+HEALTH_RISK+'）</b>' : '');
  }

  const rows = list.map(function(m){
    const st    = m.health>=HEALTH_OK?'健康':m.health>=HEALTH_RISK?'关注':'风险';
    const stCls = m.health>=HEALTH_OK?'green':m.health>=HEALTH_RISK?'orange':'red';
    return '<tr class="cursor" onclick="openMerchant(\''+m.name+'\')">'
      + '<td><div class="mname">'+m.name+'</div></td>'
      + '<td class="hide-sm">'+tierPill(m.tier, m)+'</td>'
      + '<td>'+healthBar(m.health, m.hw)+'</td>'
      + '<td class="num">'+m.spend.toFixed(1)+'<span class="ghost"> 万</span></td>'
      + '<td class="num">'+m.roas.toFixed(2)+'</td>'
      + '<td class="num hide-sm" style="color:'+(m.mom>=0?'var(--green)':'var(--red)')+'">'
      +   (m.mom>=0?'+':'')+m.mom.toFixed(1)+'%</td>'
      + '<td><span class="pill '+stCls+'">'+st+'</span></td>'
      + '<td><button class="btn-mini">诊断 →</button></td>'
      + '</tr>';
  }).join('')
  /* 空态是**有信息量的**:这一层筛不出风险商家本身就是结论,不该只是留白 */
  || '<tr><td colspan="8" style="text-align:center;padding:26px 12px;color:var(--t3);font-size:12.5px">'
   + '当前筛选下没有商家 —— 这一层没有状态为「风险」的商家(健康度均 ≥'+HEALTH_RISK+'),说明处在该阶段的商家整体健康,'
   + '不需要个案介入。</td></tr>';

  return ''
  + '<div class="tabs">'+tabs+'</div>'
  + '<div class="card"><div class="card-h">'+icon('layers',16)+'<h3>'+boardTitle+'</h3>'
  +   '<span class="desc">'+boardDesc+'</span></div>'
  +   '<div class="card-b"><div class="tierbar">'+boardBar+'</div><div class="tierleg">'+boardLeg+'</div>'
  +   tierNote() + healthNote() + '</div></div>'
  + secTitle('store','商家列表','点击任一行进入该商家诊断')
  + '<div class="card"><div class="card-b"><div class="tbl-wrap"><table class="tbl">'
  +   '<thead><tr><th>商家</th><th class="hide-sm">分层</th><th>健康度</th><th>月消耗</th>'
  +   '<th>ROAS</th><th class="hide-sm">环比</th><th>状态</th><th></th></tr></thead>'
  +   '<tbody>'+rows+'</tbody>'
  + '</table></div></div></div>'
  + '<div class="scopenote">'+icon('info',14)
  +   '<div><div>口径说明 · 本页是<b>分层管理下的重点商家池,共 '+MERCHANTS.length+' 家</b>。'
  +     '按消耗量级与经营健康度筛出后进入日常单个跟进的名单,只有进入这个池子的商家才走'
  +     '「诊断 → 处置 → 沉淀」的完整流程。</div>'
  +   '<div class="mt">平台在投商家共 <b>'+DATA.platform.activeMch.toLocaleString()+' 家</b>'
  +     '(见商业化大盘「活跃投放商家」),其余商家按分层规则做<b>批量运营</b>,不占用个案运营人力。'
  +     '两个数字的分母不同,本页消耗合计不可与大盘消耗直接相除。<br>'
  +     '注意<b>「进池规则」与「池内分层」是两回事</b>:进池看消耗量级与健康度(决定谁值得占用个案人力),'
  +     '进池之后按生命周期分段(决定这批商家各自处在哪一段、该用什么节奏跟)。</div></div>'
  + '</div>';
}

/* =========================================================
   页3 · 商家诊断
   ========================================================= */
const CPA_BASE = { cpm:40, ctr:2.0, cvr:5.0 };
function cpaOf(cpm,ctr,cvr){ return cpm / (1000 * (ctr/100) * (cvr/100)); }

/* ---------------------------------------------------------
   诊断数据:三家重点商家用人工撰写的数据,其余商家按其在
   商家管理页的指标(消耗 / ROAS / 健康度)确定性推导一份,
   保证搜索到任意一家都能看到自洽的漏斗与结论,而非套用别人的数据。
   --------------------------------------------------------- */
/* 十万以下保留两位小数:入口量级小到几千的商家,一位小数会把「0.17 万」塌成「0.2 万」,
   读者拿上两格除不出下一格,只会以为数是编的。大数照旧取整,不进位的话读起来太啰嗦。 */
function fmtWan(v){
  return (v >= 1000 ? Math.round(v).toLocaleString()
        : v >= 100  ? String(Math.round(v))
        : v >= 10   ? v.toFixed(1)
        :             v.toFixed(2)) + ' 万';
}
const ROAS_BASE = { '新客期':1.95, '成长期':2.42, '成熟期':2.68, '衰退期':1.60 };

function synthDiag(m){
  const h = m.health;
  const cpm = 52 - h * 0.18;                     // 健康度越高,拿量成本越低
  const ctr = 1.1 + h * 0.026;
  const cvr = 1.2 + h * 0.042;
  const mergeR  = 0.14 + h * 0.0022;             // 两入口汇入主链路的综合转化
  const dealR   = 0.06 + h * 0.0016;             // 进店/加购 → 成交
  const repR    = 0.08 + h * 0.0022;             // 成交 → 30 日复购

  const impWan  = m.spend * 1000 / cpm;
  const clkWan  = impWan * ctr / 100;
  const cartWan = clkWan * mergeR;
  const deals   = Math.round(cartWan * 10000 * dealR);
  const reps    = Math.round(deals * repR);
  const ltv     = Math.round(120 + h * 3.4);

  /* 健康度决定断点落在链路哪一环,而不是所有商家共用一套结论 */
  const band = h >= 75 ? 'good' : h >= 55 ? 'mid' : h >= 45 ? 'warn' : 'bad';

  const main = [
    /* 主链路四格一律用绝对数,不混「万」—— 成交 / 复购本来就是绝对数,
       进店/加购写「万」的话这一行会中途换单位,而且小数位一省就和下一格除不开 */
    { ic:'cart',   name:'进店 / 加购', num:Math.round(cartWan * 10000).toLocaleString(),
      note:'来自两个入口', flag: band === 'warn' ? '断点' : '' },
    { ic:'deal',   name:'成交',       num:deals.toLocaleString(), note:'成交转化 '+(dealR*100).toFixed(1)+'%' },
    { ic:'repeat', name:'复购',       num:reps.toLocaleString(),
      note:'30 日复购 '+(repR*100).toFixed(1)+'%', flag: band === 'mid' ? '断点' : '' },
    { ic:'ltv',    name:'LTV',        num:'¥'+ltv, note:'12 个月口径' }
  ];

  const verdict = {
    good:'链路各环节转化均在同品类健康区间内,当前无需介入。建议维持既有投放结构,并按周更新素材以控制衰减。',
    mid:'前端获客与成交环节表现正常,但 30 日复购率低于同品类基准,LTV 对当前出价水平的支撑不足。建议围绕留存事件优化,暂缓放量。',
    warn:'两个入口的点击表现正常,但汇入主链路后的承接转化低于同品类基准,流失集中在落地页与商品信息一致性,建议优先排查承接环节。',
    bad:'两个入口的点击率均显著低于同品类水平,曝光未能有效转化为点击。判断为定向覆盖与素材吸引力问题,与承接链路无关,不应通过调整出价解决。'
  }[band];

  const base = ROAS_BASE[m.tier] || 2.42;
  const gap  = m.roas - base;

  /* 两个入口的曝光 / 点击按固定比例拆分,比例和手写商家同一套结构(76/24、46/54)。
     CTR 必须由拆分后的这两个数算出来,不能另写一个乘数 —— 写死乘数的话,
     卡片上的「曝光」「点击」「CTR」三个数互相乘不开,细看就露馅。 */
  const impFeed = impWan * 0.76, clkFeed = clkWan * 0.46;
  const impSrch = impWan * 0.24, clkSrch = clkWan * 0.54;

  return {
    sector: m.sector || '美妆护肤', tier: m.tier, health: h,
    triple: [
      { k:'商家 ROAS', v:m.roas.toFixed(2),
        f:'行业基准 ' + base.toFixed(2) + ' · ' + (gap >= 0.2 ? '高于基准' : gap >= -0.2 ? '与基准持平' : '低于基准'),
        tone: gap >= -0.2 ? 'ok' : gap >= -0.8 ? 'warn' : 'bad' },
      { k:'平台消耗', v:'¥' + m.spend.toFixed(1) + ' 万',
        f:'环比 ' + (m.mom >= 0 ? '+' : '') + m.mom.toFixed(1) + '%',
        tone: m.mom >= -10 ? 'ok' : m.mom >= -20 ? 'warn' : 'bad' },
      { k:'用户负反馈', v: (0.30 + (100 - h) * 0.006).toFixed(2) + '%',
        f:'护栏阈值 0.80% · 安全', tone:'ok' }
    ],
    entrances: [
      { key:'信息流', ic:'exposure', color:'var(--orange)', bg:'var(--orange-50)',
        exposure:fmtWan(impFeed), click:fmtWan(clkFeed),
        ctr:(clkFeed/impFeed*100).toFixed(1)+'%', brk: band === 'bad' },
      { key:'搜索', ic:'search', color:'var(--blue)', bg:'var(--blue-50)',
        exposure:fmtWan(impSrch), click:fmtWan(clkSrch),
        ctr:(clkSrch/impSrch*100).toFixed(1)+'%', brk:false }
    ],
    main: main,
    mergeRate: (mergeR*100).toFixed(1) + '%',
    verdict: verdict,
    cpa: { cpm: Math.round(cpm), ctr: +ctr.toFixed(1), cvr: +cvr.toFixed(1) }
  };
}

/* 分层与健康度只有 MCH_RAW 一个来源:人工写的三份诊断里不再重复这两个字段,
   需要它们的时候从这里取。两份数据各写一遍,迟早会对不上。 */
function diagFor(name){
  const m = MERCHANTS.filter(function(x){ return x.name === name; })[0];
  const d = DIAG[name] ? Object.assign({}, DIAG[name]) : (m ? synthDiag(m) : Object.assign({}, DIAG['mock案例商家']));
  if(m){ d.tier = m.tier; d.health = m.health; }
  return d;
}

/* =========================================================
   打法卡沉淀 · 把一次诊断变成一张能被检索到的卡
   ---------------------------------------------------------
   打法卡的作用:平台运营每天处理的是个案,但同类断点会在不同商家反复出现。
   卡片把这套处置经验从「某个人的经验」变成「可被检索、可被引用、可被复核的资产」——
   助手回答下一次同类问题时引用的就是它,而不是每次重新推理。

   链路:诊断页定位断点 → 打开沉淀弹窗(4 项已由诊断预填)→ 运营补 2 项 → 入册
        → 卡片进入 retrieve() 的语料池 → 同样的提问立刻能命中新卡 → 引用次数 +1
   ========================================================= */

/* 断点判定 → 卡片的结构化字段。运营不需要重新描述问题,机器能推的都推出来。 */
function breakpointOf(d){
  const ents = (d.entrances || []).filter(function(e){ return e.brk; });
  const cart = (d.main || []).filter(function(s){ return s.name.indexOf('进店') >= 0 && s.flag; })[0];
  const rep  = (d.main || []).filter(function(s){ return s.name.indexOf('复购') >= 0 && s.flag; })[0];
  /* 双入口同时出问题时用「双入口」,单入口则点名是哪一个 */
  const many = ents.length > 1;
  const eWord  = many ? '双入口' : (ents.length ? ents[0].key : '');
  const eLabel = many ? '双入口' : (ents.length ? ents[0].key + '入口' : '');
  if(ents.length && cart) return { kind:'carry',  ent:eWord,  node:cart.name };
  if(rep)                 return { kind:'repeat', ent:'',     node:rep.name };
  if(cart)                return { kind:'carry',  ent:'',     node:cart.name };
  if(ents.length)         return { kind:'click',  ent:eLabel, node:'' };
  return { kind:'none', ent:'', node:'' };
}

/* 名称 = {症状}:{动作},两段都是只读枚举。这两段是检索键,不是给人看的标题:
   retrieve() 统计的是查询二元组在「标题+场景+策略+效果+限制+标签」里的覆盖率,
   所以症状段必须用会出现在提问里的业务词(承接、复购、点击率),而不是商家名或日期。 */
const FG_SYM = {
  carry : ['{e}承接环节转化偏低', '{e}进店 / 加购转化率低于同品类', '落地页承接转化不达预期'],
  click : ['{e}点击率不足', '曝光到点击的转化效率偏低', '素材点击效率低于同品类'],
  repeat: ['30 日复购率低于同品类基准', 'LTV 支撑不住当前出价', '复购事件回传后仍无起色'],
  none  : ['链路各环节转化达标', '投放结构稳定无需介入']
};
const FG_ACT = {
  carry : ['按落地页与商品信息一致性排查', '重建落地页与商品的承接链路', '先做素材与落地页的对照实验'],
  click : ['放宽定向覆盖并轮换素材', '提高素材更新频率并扩大人群包', '先跑量再逐步收敛定向'],
  repeat: ['按留存事件优化出价目标', '把优化事件前置到首单后 7 日', '先控预算等待复购样本'],
  none  : ['维持既有投放结构', '维持结构并按周更新素材']
};
function fgFill(tpl, e){ return tpl.replace('{e}', e || '主链路'); }

function forgeCtx(){
  const name = state.merchant;
  const d    = diagFor(name);
  const m    = MERCHANTS.filter(function(x){ return x.name === name; })[0] || {};
  const bp   = breakpointOf(d);
  const syms = FG_SYM[bp.kind].map(function(s){ return fgFill(s, bp.ent); });
  return {
    name:name, d:d, m:m, bp:bp, syms:syms, acts:FG_ACT[bp.kind],
    sector: d.sector || m.sector || '美妆护肤',
    tier:   d.tier   || m.tier   || '成长期'
  };
}

/* 适用场景:断点 + 该类商家在诊断里已有的量化位置,让复用者能判断「像我」还是「不像我」 */
function forgeScene(x, sym){
  const roas = (typeof x.m.roas === 'number') ? x.m.roas.toFixed(2) : null;
  const base = ROAS_BASE[x.tier] || 2.42;
  return x.sector + '类目 · ' + x.tier + '商家出现「' + sym + '」；'
    + (roas ? '商家 ROAS ' + roas + '（同层级基准 ' + base.toFixed(2) + '），' : '')
    + (typeof x.m.spend === 'number' ? '月消耗 ' + x.m.spend.toFixed(1) + ' 万' : '处于同类业务阶段');
}

/* 策略设置:诊断结论里那句「建议…」就是处方,直接成句带入,运营再补执行细节 */
function forgeSetup(d, act){
  const adv = d.verdict.split('。').filter(function(s){ return s.indexOf('建议') >= 0; })[0];
  if(adv) return adv.trim() + '。';
  return '按「' + act + '」处置,先在小流量组验证,方向确认后再放量。';
}

/* 主指标:断点落在哪一环,就盯哪一环的读数。
   处置登记和打法卡都用它,保证「盯的指标」和「诊断出的断点」永远是一回事。 */
function metricOf(d, bp){
  if(bp.kind === 'click')
    return { name:'入口点击率 CTR',
             base:(d.entrances || []).map(function(e){ return e.key + ' ' + e.ctr; }).join(' / ') };
  if(bp.kind === 'repeat'){
    const r = (d.main || []).filter(function(s){ return s.name.indexOf('复购') >= 0; })[0];
    return { name:'30 日复购率', base: r ? String(r.note).replace('30 日复购 ', '') : '—' };
  }
  return { name:'两入口合并进店转化率', base: d.mergeRate };
}

/* 断点类型 → 当前确实落在这一环上的商家,以及这批商家的规模。
   一张卡值不值得被复用、一条需求值不值得提,靠的都是这个数 ——
   而且它是**实时算的**:商家数据一变,受影响的范围跟着变,
   所以卡片和需求都不会随着时间推移变成一份不知道还能给谁用的旧文档。
   打法卡和产品需求共用这一个函数,两边的「影响面」因此永远对得上。 */
function kindImpact(kind){
  if(!kind || kind === 'none') return { names:[], n:0, spend:0 };
  const ms = MERCHANTS.filter(function(m){
    return breakpointOf(diagFor(m.name)).kind === kind;
  }).sort(function(a,b){ return b.spend - a.spend; });
  return {
    names: ms.map(function(m){ return m.name; }),
    n: ms.length,
    spend: ms.reduce(function(s,m){ return s + m.spend; }, 0)
  };
}
function merchantsForKind(kind){ return kindImpact(kind).names; }
function needImpactOf(n){ return kindImpact(n.bp); }

/* 诊断页的回执:只有已经排期或上线的需求才对外出现。
   一条需求最多显示两条回执,多了会把断点判定本身挤下去。 */
function needsForKind(kind){
  if(!kind || kind === 'none') return [];
  return NEEDS.filter(function(n){
    return n.bp === kind && NEED_SHOW.indexOf(n.status) >= 0;
  }).slice(0, 2);
}
function needStrip(kind){
  const ns = needsForKind(kind);
  if(!ns.length) return '';
  return ns.map(function(n){
    const imp = needImpactOf(n);
    return '<div class="needstrip">' + icon('need',15)
      + '<span><span class="lb">已有产品方案</span> · <b>' + n.id + '</b>「' + n.title + '」'
      +   ' · 状态 <b>' + n.status + '</b> · 覆盖 <b>' + imp.n + '</b> 家 / ¥'
      +   imp.spend.toFixed(1) + ' 万</span>'
      + '<span class="go" onclick="goNeeds()">查看 →</span>'
      + '</div>';
  }).join('');
}

/* 该不该提需求,页面先算一遍,不靠运营拍脑袋:
     (a) 同类断点已经在全池重复出现 → 不是单家的操作问题
     (b) 这家登记过的处置全部未达标 → 商家侧的动作已经试过
   两条都不成立时按钮仍然在,只是理由降级成「由你判断」——不硬推。 */
const NEED_CROWD = 3;
function needEvidence(mch){
  const bp  = breakpointOf(diagFor(mch));
  const imp = kindImpact(bp.kind);
  const done = ACTIONS.filter(function(a){ return a.mch === mch && a.status !== '观察中'; });
  const fail = done.filter(function(a){ return a.status === '未达标'; });
  const tried = done.length > 0 && fail.length === done.length;
  const reasons = [];
  if(imp.n >= NEED_CROWD)
    reasons.push('全池 ' + imp.n + ' 家同类断点 · 合计月消耗 ¥' + imp.spend.toFixed(1)
               + ' 万 —— 已在跨商家重复出现，不是单家的操作问题');
  if(tried)
    reasons.push('这家 ' + done.length + ' 条处置全部未达标 —— 商家侧动作已经试过，问题多半不在商家手上');
  return { bp:bp, imp:imp, done:done.length, fail:fail.length, tried:tried,
           reasons:reasons, suggest:reasons.length > 0 };
}
function toggleKind(id){
  state.kindOpen[id] = !state.kindOpen[id];
  renderShell();
}
function kindBlock(c){
  if(!c.kind || c.kind === 'none') return '';
  const ms = merchantsForKind(c.kind);
  if(!ms.length) return '';
  const open = !!state.kindOpen[c.id];
  return '<div class="khits">'
    + '<button class="hits-btn'+(open?' on':'')+'" onclick="toggleKind(\''+c.id+'\')">'
    +   icon('target',13) + '<span>命中同类断点 <b>' + ms.length + '</b> 家</span>'
    +   '<span class="chev">' + icon('chevDown',13) + '</span></button>'
    + (open
        ? '<div class="hits-list">'
          + ms.map(function(n){
              return '<span class="hchip" onclick="openMerchant(\''+n+'\')">'+n+'</span>';
            }).join('')
          + '<span class="hits-note">点商家名直接进入该商家的诊断</span></div>'
        : '')
    + '</div>';
}

/* 需求卡上的同一块:断点影响面 + 可以点开逐家看的名单。
   和 kindBlock 长得一样、用的是同一个 toggleKind 和同一套 .khits 样式 ——
   两种沉淀物结构同构,就没必要让它们看起来像两个东西。 */
function needBlock(n){
  const imp = needImpactOf(n);
  if(!imp.n) return '';
  const open = !!state.kindOpen[n.id];
  return '<div class="khits">'
    + '<button class="hits-btn'+(open?' on':'')+'" onclick="toggleKind(\''+n.id+'\')">'
    +   icon('target',13) + '<span>命中同类断点 <b>' + imp.n + '</b> 家</span>'
    +   '<span class="chev">' + icon('chevDown',13) + '</span></button>'
    + (open
        ? '<div class="hits-list">'
          + imp.names.map(function(x){
              return '<span class="hchip" onclick="openMerchant(\''+x+'\')">'+x+'</span>';
            }).join('')
          + '<span class="hits-note">点商家名直接进入该商家的诊断</span></div>'
        : '')
    + '</div>';
}

/* 效果结果:新卡是「验证中」,还没有结论,预填的只能是整改前的基线值 */
function forgeEffect(d, bp){
  const mt = metricOf(d, bp);
  return '待验证 · 整改前基线:' + mt.name + ' ' + mt.base;
}

/* 标签:断点环节 + 类目 + 分层。标签命中在检索里额外加权 0.12/个 */
function forgeTags(x, bp){
  const t = [];
  if(bp.ent && bp.ent !== '双入口') t.push(bp.ent);
  t.push({ carry:'承接', click:'点击率', repeat:'复购', none:'投放' }[bp.kind]);
  t.push('转化率');
  if(bp.node) t.push(bp.node);
  t.push(x.sector, x.tier);
  /* 去重:检索里标签命中是逐个加权的,重复标签会让这张卡白白多拿权重 */
  return t.filter(function(v, i){ return v && t.indexOf(v) === i; });
}

let FORGE = null;

function openForge(){
  const x = forgeCtx();
  FORGE = {
    ctx:x, bp:x.bp,
    sym:x.syms[0], act:x.acts[0],
    tags: forgeTags(x, x.bp)
  };
  const opt = function(arr, cur){
    return arr.map(function(o){ return '<option'+(o===cur?' selected':'')+'>'+o+'</option>'; }).join('');
  };
  const bpText = {
    carry : '承接链路(进店 / 加购)',
    click : '曝光 → 点击',
    repeat: '复购 / 留存',
    none  : '无显著断点'
  }[x.bp.kind];

  const el = document.createElement('div');
  el.className = 'mask';
  el.onclick = function(e){ if(e.target === el) closeForge(); };
  el.innerHTML = '<div class="modal fgmodal">'
    + '<div class="modal-h">'+icon('book',18)+'<h3>沉淀为打法卡</h3>'
    +   '<button class="x" onclick="closeForge()">✕</button></div>'
    + '<div class="modal-b">'

    + '<div class="fg-src">'+icon('pulse',15)
    +   '<span>来源诊断 · <b>'+x.name+'</b>（'+x.sector+' · '+x.tier+'）　断点位置 · <b>'+bpText+'</b></span></div>'

    + '<div class="fg-lb">名称<span class="hint">助手的检索键,只能用「症状:动作」两段式选择,不能自由输入</span></div>'
    + '<div class="fg-name" id="fgName"></div>'
    + '<div class="fg-compose">'
    +   '<label class="fg-sel"><span>症状</span><select id="fgSym" onchange="forgeSyncName()">'+opt(x.syms, FORGE.sym)+'</select></label>'
    +   '<label class="fg-sel"><span>动作</span><select id="fgAct" onchange="forgeSyncName()">'+opt(x.acts, FORGE.act)+'</select></label>'
    + '</div>'

    + '<div class="fg-lb">适用场景<span class="hint">已根据断点与该商家的量化位置填好</span></div>'
    + '<textarea id="fgScene" rows="2">'+forgeScene(x, FORGE.sym)+'</textarea>'

    + '<div class="fg-lb">策略设置<span class="hint">取自本次诊断结论里的处置建议,可补充执行细节</span></div>'
    + '<textarea id="fgSetup" rows="2">'+forgeSetup(x.d, FORGE.act)+'</textarea>'

    + '<div class="fg-lb">效果结果<span class="hint">新卡以「验证中」入册,这里先记整改前基线</span></div>'
    + '<textarea id="fgEffect" rows="2">'+forgeEffect(x.d, x.bp)+'</textarea>'

    + '<div class="fg-lb need">限制条件<span class="hint">必须填写 · 决定这张卡什么时候<strong>不</strong>适用</span></div>'
    + '<textarea id="fgLimit" rows="2" placeholder="例如:仅适用于搜索词报告可用的账户；类目词竞争激烈时迁移速度要放慢"></textarea>'
    + '<div class="fg-note">'+icon('info',14)
    +   '<span>这一格机器填不了:它是助手判断「能不能安全引用这张卡」的护栏。'
    +   '检索会命中语义相近但场景不符的卡,限制条件是唯一能拦住它们的东西。</span></div>'

    + '<div class="fg-lb">标签<span class="hint">检索时命中标签额外加权</span></div>'
    + '<div class="fg-tags">'+FORGE.tags.map(function(t){

  });
  return 'C-' + String(max + 1).padStart(3, '0');
}

function forgeSubmit(){
  const val = function(id){ const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const err = document.getElementById('fgErr');
  const fail = function(msg, focusId){
    err.innerHTML = icon('alert',14) + '<span>' + msg + '</span>';
