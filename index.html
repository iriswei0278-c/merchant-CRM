    const f = document.getElementById(focusId);
    if(f) f.focus();
  };
  err.style.display = 'none';

  const title = FORGE.sym + ':' + FORGE.act;
  const limit = val('fgLimit');
  const scene = val('fgScene');
  const setup = val('fgSetup');
  const effect= val('fgEffect');

  /* 同名卡会让检索结果无法区分,直接拦住 */
  if(CARDS.some(function(c){ return c.title === title; }))
    return fail('知识库中已存在同名卡片「' + title + '」,请换一种症状或动作措辞。', 'fgSym');
  if(!scene)  return fail('「适用场景」不能为空,复用者要靠它判断这张卡是否适用于自己。', 'fgScene');
  if(!setup)  return fail('「策略设置」不能为空,否则卡片无法被引用。', 'fgSetup');
  if(!limit)  return fail('「限制条件」必须填写——没有它,这张卡在场景不符时也会被检索命中并引用出去。', 'fgLimit');

  const card = {

    scene: scene, setup: setup, effect: effect, limit: limit,
    tags: FORGE.tags, created: KB_TODAY,

  };
  CARDS.unshift(card);          // 新卡置顶,沉淀完在知识库第一眼就能看到
  saveCards();
  /* 反向挂钩:这一步是「先登记处置、后沉淀卡片」的顺序。
     挂上之后,到期回收达标时才知道该把这**张**卡转成「已验证」,而不是去猜最近一张。 */
  linkCard(card.src, card.id);

  closeForge();
  state.justCreated = card.id;
  state.kview = 'cards';
  go('knowledge');
}

/* =========================================================
   投放可持续性 · 扩量还是止损
   ---------------------------------------------------------
   转化链路走到 LTV 就停了,但 LTV 单独看没有意义——它必须和 CPA 相除。
   LTV/CPA 给出「有没有放量的本钱」,断点给出「现在放量合不合适」,
   两个维度交叉才是第 ⑨ 步(扩量或止损)真正的判据。
   ========================================================= */
function parseNum(s){ return parseFloat(String(s).replace(/[^0-9.]/g, '')) || 0; }

function unitEcon(d, m){
  const deals = parseNum((d.main[1] || {}).num);          // 成交单量
  const ltv   = parseNum((d.main[3] || {}).num);          // 12 个月 LTV
  const spend = (m && typeof m.spend === 'number') ? m.spend * 10000 : 0;
  if(!deals || !ltv || !spend) return null;
  const cpa   = spend / deals;                             // 与链路读数同源,不另造口径
  const ratio = ltv / cpa;
  const hasBrk = (d.main || []).some(function(s){ return s.flag; })
              || (d.entrances || []).some(function(e){ return e.brk; });
  const ok = ratio >= 3.0;                                 // 演示口径:健康线 3.0x
  return {
    deals:deals, ltv:ltv, spend:spend, cpa:cpa, ratio:ratio, ok:ok, hasBrk:hasBrk,
    verdict: ok
      ? (hasBrk ? '经济性可支撑扩量,但断点未修复,放量会放大低效消耗 —— 先修断点再放量'
                : '经济性可支撑扩量,可按预算节奏加投')
      : (hasBrk ? '单位经济性偏紧且存在断点 —— 先修断点,并暂缓放量'
                : '单位经济性偏紧 —— 控制放量速度,优先提复购')
  };
}

/* =========================================================
   处置登记与效果回填
   ---------------------------------------------------------
   诊断给出结论之后,运营真实要做的是三步:记下要改什么 → 定观察指标和期限 → 到期回收结果。
   之前的版本把这三步漏掉了,所以「诊断 → 扩量/止损 → 复盘沉淀」在页面上是断的。
   这一层把断点接上,并让打法卡能在达标时从「验证中」转「已验证」。
   ========================================================= */
const LS_ACTIONS = 'xhs_crm_actions_v1';
let ACTIONS = (function(){
  const a = lsGet(LS_ACTIONS);
  return Array.isArray(a) ? a : [];
})();
function saveActions(){ lsSet(LS_ACTIONS, ACTIONS); }

function addDays(iso, n){
  const p = iso.split('-').map(Number);
  const t = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  t.setUTCDate(t.getUTCDate() + n);
  return t.toISOString().slice(0, 10);
}
/* 演示口径:以 KB_TODAY 为当期,保证每次打开看到的剩余天数一致 */
function dueOf(a){ return addDays(a.start, a.days); }
function daysLeftOf(a){
  const ms = new Date(dueOf(a) + 'T00:00:00Z') - new Date(KB_TODAY + 'T00:00:00Z');
  return Math.round(ms / 86400000);
}
function openActionOf(mch){
  return ACTIONS.filter(function(a){ return a.mch === mch && a.status === '观察中'; })[0] || null;
}

/* 负责人只认工号(user N),不写姓名:这是内部工作台,名单会变、会离职,
   工号才是能一直对得上的键。下拉里顺带报在手条数,避免把处置都堆给同一个人。 */
const OPS = ['user 1','user 2','user 3','user 4','user 5'];
function opsLoad(u){
  return ACTIONS.filter(function(a){ return a.owner === u && a.status === '观察中'; }).length;
}
function opsOptions(cur){
  return OPS.map(function(u){
    const n = opsLoad(u);
    return '<option value="'+u+'"'+(u===cur?' selected':'')+'>'+u
         + '（'+(n ? '在手 '+n+' 条' : '空闲')+'）</option>';
  }).join('');
}
/* 默认派给手上最少的那个人,而不是永远默认第一个——否则派单会天然堆在 user 1 身上 */
function opsDefault(){
  return OPS.slice().sort(function(a,b){ return opsLoad(a) - opsLoad(b); })[0];
}
function latestCardOf(mch){
  const mine = CARDS.filter(function(c){ return c.mine && c.src === mch; });
  return mine.length ? mine[0] : null;   // CARDS 新卡置顶,取到的是最近一张
}

}

function submitAction(){

  if(!target){

    return;
  }
  const id = 'A-' + String(ACTIONS.length + 1).padStart(3, '0');
  const card = latestCardOf(ACT.name);
  ACTIONS.push({
    id:id, mch:ACT.name, sym:ACT.bp.kind, owner: val('acOwner') || OPS[0],
    do: val('acDo'), metric: val('acMetric'), base: val('acBase'), target: target,
    guard: val('acGuard'), days: ACT.days || 14, start: KB_TODAY,
    status:'观察中', actual:'', cardId: card ? card.id : null
  });
  saveActions();
  closeAction();
  renderShell();
}

let REC = null;
function openRecover(id){
  const a = ACTIONS.filter(function(x){ return x.id === id; })[0];
  if(!a) return;
  REC = a;
  const card = a.cardId ? CARDS.filter(function(c){ return c.id === a.cardId; })[0] : null;
  const el = document.createElement('div');
  el.className = 'mask';
  el.onclick = function(e){ if(e.target === el) closeRecover(); };
  el.innerHTML = '<div class="modal fgmodal">'
    + '<div class="modal-h">'+icon('check',18)+'<h3>回收处置结果 · '+a.id+'</h3>'
    +   '<button class="x" onclick="closeRecover()">✕</button></div>'
    + '<div class="modal-b">'
    + '<div class="fg-src">'+icon('pulse',15)
    +   '<span>商家 <b>'+a.mch+'</b>　负责人 <b>'+(a.owner||'—')+'</b>'
    +   '　主指标 <b>'+a.metric+'</b>　处置前 <b>'+a.base+'</b>　目标 <b>'+a.target+'</b></span></div>'

    + '<div class="fg-lb need">实测值<span class="hint">必须填写 · 回收结果就是给它一个诚实的读数</span></div>'
    + '<textarea id="rcActual" rows="1" placeholder="例如:30.4%"></textarea>'

    + '<div class="fg-lb">判定<span class="hint">达标会把关联打法卡转为「已验证」;未达标会把原因写回它的限制条件</span></div>'
    + '<div class="fg-days">'
    +   '<button type="button" class="daybtn on" data-v="达标" onclick="pickJudge(this)">达标</button>'
    +   '<button type="button" class="daybtn" data-v="未达标" onclick="pickJudge(this)">未达标</button>'
    + '</div>'

    + '<div class="fg-lb">结论<span class="hint">可选 · 写进卡片效果结果的一段话</span></div>'
    + '<textarea id="rcNote" rows="2" placeholder="例如:落地页改版后 14 日内进店转化率回到 30.4%,泛词占比未反弹"></textarea>'

    + (card ? '<div class="fg-note">'+icon('book',14)
        + '<span>关联打法卡 <b>'+card.id+'「'+card.title+'」</b> 当前状态「'+card.status+'」。</span></div>' : '')

    + '<div class="fg-err" id="rcErr"></div>'
    + '<div class="fg-foot">'
    +   '<span class="fg-auto">'+icon('check',14)+'到期 '+dueOf(a)+' · 观察 '+a.days+' 天</span>'
    +   '<button class="btn-ghost" onclick="closeRecover()">取消</button>'
    +   '<button class="btn-solid" onclick="submitRecover()">提交并归档</button>'
    + '</div></div></div>';
  document.body.appendChild(el);
  REC.judge = '达标';
}

function closeRecover(){
  const m = document.querySelector('.mask');
  if(m) m.remove();
  REC = null;
}

function pickJudge(btn){
  REC.judge = btn.dataset.v;
  Array.prototype.forEach.call(btn.parentNode.children, function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
}

function submitRecover(){
  const actual = (document.getElementById('rcActual').value || '').trim();
  const err = document.getElementById('rcErr');
  if(!actual){
    err.innerHTML = icon('alert',14) + '<span>「实测值」必须填写——只想结束观察而不记录结果的话,这条处置对知识库没有任何贡献。</span>';
    err.style.display = 'flex';
    document.getElementById('rcActual').focus();
    return;
  }
  const a = REC;
  const note = (document.getElementById('rcNote').value || '').trim();
  a.actual = actual;
  a.status = a.judge;
  a.closed = KB_TODAY;

  /* 回填打法卡:这是知识库真正「反哺」的那一步——卡从假设变成有结论的经验 */
  const card = a.cardId ? CARDS.filter(function(c){ return c.id === a.cardId; })[0] : null;
  if(card){
    if(a.judge === '达标'){
      card.status = '已验证';
      card.effect = a.base + ' → ' + actual + ',达标(' + a.metric + ',观察 ' + a.days + ' 天)'
                  + (note ? '。' + note : '');
    } else {
      /* 未达标不改状态,但把这次的条件写进限制条件——这正是「什么时候不适用」的证据 */
      card.limit = card.limit + ' 【' + KB_TODAY + ' 回收:' + a.metric + ' 实测 ' + actual
                 + ',目标 ' + a.target + ',未达标' + (note ? '(' + note + ')' : '') + '。】';
    }
    saveCards();
  }
  saveActions();
  closeRecover();
  renderShell();
}

function calcCpa(){
  const el = function(id){ return document.getElementById(id); };
  if(!el('sCpm')) return;
  const cpm = parseFloat(el('sCpm').value);
  const ctr = parseFloat(el('sCtr').value);
  const cvr = parseFloat(el('sCvr').value);
  el('vCpm').textContent = cpm.toFixed(1);
  el('vCtr').textContent = ctr.toFixed(1)+'%';
  el('vCvr').textContent = cvr.toFixed(1)+'%';

  const b = CPA_BASE;
  const v0 = cpaOf(b.cpm, b.ctr, b.cvr);          // 基准
  const v1 = cpaOf(cpm,   b.ctr, b.cvr);          // 只动 CPM
  const v2 = cpaOf(cpm,   ctr,   b.cvr);          // 再动 CTR
  const v3 = cpaOf(cpm,   ctr,   cvr);            // 全动

  el('cpaNow').textContent  = v3.toFixed(1);
  el('cpaBase').textContent = v0.toFixed(1);

  el('cpaFormula').innerHTML =
      'CPA = CPM ÷ (1000 × CTR × CVR)<br>'
    + '&nbsp;&nbsp;&nbsp;&nbsp;= ' + cpm.toFixed(1) + ' ÷ (1000 × ' + (ctr/100).toFixed(4)
    +   ' × ' + (cvr/100).toFixed(4) + ')<br>'
    + '&nbsp;&nbsp;&nbsp;&nbsp;= ' + cpm.toFixed(1) + ' ÷ ' + (1000*(ctr/100)*(cvr/100)).toFixed(4)
    + ' = <em>' + v3.toFixed(1) + ' 元</em>';

  const steps = [
    { lab:'CPM', d:v1-v0 },
    { lab:'CTR', d:v2-v1 },
    { lab:'CVR', d:v3-v2 }
  ];
  const maxAbs = Math.max(Math.abs(v1-v0), Math.abs(v2-v1), Math.abs(v3-v2), 0.001);
  const top = steps.reduce(function(a,s){ return Math.abs(s.d)>Math.abs(a.d)?s:a; }, steps[0]);

  el('cpaWf').innerHTML =
      '<div class="wrow head"><span>因子</span><span>对 CPA 的贡献</span>'
    + '<span style="text-align:right">影响</span></div>'
    + steps.map(function(s){
        const cls = s.d>=0 ? 'p' : 'n';
        const w = Math.abs(s.d)/maxAbs*100;
        return '<div class="wrow"><span class="wlab">'+s.lab+'</span>'
          + '<div class="wbar"><i class="'+cls+'" style="width:'+w.toFixed(1)+'%"></i></div>'
          + '<span class="wval '+cls+'">'+(s.d>=0?'+':'−')+Math.abs(s.d).toFixed(1)+'</span></div>';
      }).join('')
    + '<div class="wrow"><span class="wlab" style="color:var(--t1)">合计</span>'
    + '<div class="wbar"></div><span class="wval '+(v3>=v0?'p':'n')+'">'
    + (v3>=v0?'+':'−')+Math.abs(v3-v0).toFixed(1)+'</span></div>';

  const advice = {
    CVR:'<b>CVR 是主因。</b>优先检查承接页、用户需求匹配与转化追踪，而不是仅调低出价——出价降下去只是把量一起丢掉。',
    CPM:'<b>CPM 是主因。</b>优先看竞价环境与定向覆盖，盲目压低出价会同时失去量与竞争力。',
    CTR:'<b>CTR 是主因。</b>优先查首屏吸引力与素材疲劳，而不是加预算——加预算只会放大低效曝光。'
  }[top.lab];
  el('cpaHint').innerHTML = '当前 CPA <b>' + v3.toFixed(1) + ' 元</b>，基准 <b>' + v0.toFixed(1)
    + ' 元</b>，差 <b>' + Math.abs(v3-v0).toFixed(1) + ' 元</b>。'
    + '影响最大的因子是 <b>' + top.lab + '</b>（' + (top.d>=0?'+':'−') + Math.abs(top.d).toFixed(1) + ' 元）。<br>'
    + advice;
}

}

/* =========================================================
   运营助手 · 基于知识库的真实检索（非大模型）
   同一问题每次结果一致、可复核，因此可被当成一条产品能力而非演示话术。
   ========================================================= */
const PRESETS = [
  '搜索投放转化率下滑，怎么排查？',
  '新商家冷启动跑不出量怎么办？',
  '复购率低于行业基准，该从哪里改？',
  '广告负反馈率越线了怎么处理？'
];
let CHAT = [];

function bigrams(s){
  const t = s.replace(/[\s，。？！、,.?!（）()「」【】:：;；·\-—]/g, '');
  const out = [];
  for(let i=0;i<t.length-1;i++) out.push(t.slice(i,i+2));
  return out;
}
/* 简化检索：查询二元组在文档中的覆盖率 + 标签命中加权。刻意保持简单、可解释。 */
function retrieve(q){
  const qb = bigrams(q);
  const qset = {}; qb.forEach(function(b){ qset[b]=1; });
  const uniq = Object.keys(qset);
  return CARDS.map(function(c){
    const doc = c.title + c.scene + c.setup + c.effect + c.limit + c.tags.join('');
    const dset = {};
    bigrams(doc).forEach(function(b){ if(qset[b]) dset[b]=1; });
    const cov = uniq.length ? Object.keys(dset).length/uniq.length : 0;
    const tagHit = c.tags.filter(function(t){ return q.indexOf(t)>=0; }).length;
    return { c:c, score: Math.min(1, cov + tagHit*0.12), cov:cov, tags:tagHit };
  }).sort(function(a,b){ return b.score-a.score; });
}
function confWord(s){ return s>=0.5 ? '高' : s>=0.28 ? '中' : '低'; }

/* msg = { who, html, q?, hits? } —— 明细跟着它所属的那条回答走 */
function pushMsg(who, html, q, hits){ CHAT.push({ who:who, html:html, q:q, hits:hits }); renderChat(); }

const HITS_OPEN = {};
function toggleHits(i){
  HITS_OPEN[i] = !HITS_OPEN[i];
  renderChat();
  const el = document.getElementById('hits-'+i);
  if(el && HITS_OPEN[i]) el.scrollIntoView({ block:'nearest' });
}

function retrievalHTML(q, hits){
  const top = hits[0];
  return '<div style="font-size:12px;color:var(--t3);margin-bottom:9px">检索词：<b style="color:var(--t1)">'+q+'</b></div>'
    + hits.slice(0,5).map(function(h,i){
        const low = h.score < 0.28;
        return '<div class="hit'+(low?' low':'')+'" onclick="go(\'knowledge\')">'
          + '<span class="sc">'+(h.score*100).toFixed(0)+'%</span>'
          + '<span class="nm">'+(i+1)+'. '+h.c.title+'</span>'
          + '<span class="src">'+h.c.id+'</span></div>';
      }).join('')
    + '<div class="hr"></div>'
    + '<div style="font-size:11.5px;color:var(--t3);line-height:1.7">'
    + '匹配度 = 查询二元组在卡片文本中的覆盖率 + 标签命中加权。<br>'
    + (top.score < 0.28
        ? '<b style="color:var(--red-600)">最高匹配度低于 28%，判定为「知识库无覆盖」。</b>'
        : '最高匹配度 <b style="color:var(--green)">'+(top.score*100).toFixed(0)+'%</b>，判定为「可引用」。')
    + '</div>';
}

function renderChat(){
  const el = document.getElementById('chatlog');
  if(!el) return;
  el.innerHTML = CHAT.map(function(m, i){
    const has = m.who === 'ai' && m.hits && m.hits.length;
    const open = !!HITS_OPEN[i];
    return '<div class="msg '+(m.who==='me'?'me':'ai')+'">'
      /* 用户消息不带头像:右边那条气泡本身已经说明了是谁在问,再加一个「我」是多余的 */
      + (m.who==='me' ? '' : '<span class="av">'+icon('robot',15)+'</span>')
      + '<div class="bub">'+m.html
      + (has
          ? '<button class="cite-btn'+(open?' on':'')+'" onclick="toggleHits('+i+')">'
            + icon('search',13) + '<span>检索明细</span>'
            + '<span class="pct">最高匹配 '+(m.hits[0].score*100).toFixed(0)+'%</span>'
            + '<span class="cv">'+icon('chevDown',13)+'</span>'
            + '</button>'
            + '<div class="hitbox" id="hits-'+i+'" style="display:'+(open?'':'none')+'">'
            +   retrievalHTML(m.q, m.hits)
            + '</div>'
          : '')
      + '</div></div>';
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function askIdx(i){ ask(PRESETS[i]); }
function askInput(){
  const el = document.getElementById('qin');
  if(!el || !el.value.trim()) return;
  const q = el.value.trim();
  el.value = '';
  ask(q);
}
function ask(q){
  pushMsg('me', q);
  const hits = retrieve(q);
  const top = hits[0];
  /* 先代入当前页面的读数,再给知识库检索结果。
     两者刻意分开呈现,这样「哪些是数据、哪些是引用」一眼可辨,可复核性不被上下文冲淡。 */
  let html = ctxBlock();

  if(top.score < 0.28){
    html += '知识库中没有匹配度足够的打法卡（最高匹配度 <b>'+(top.score*100).toFixed(0)+'%</b>）。'
      + '<br><br>此情况下不建议套用相近但不相关的策略。建议先以<b>小流量对照实验</b>验证判断，'
      + '验证通过后再沉淀为新卡片。'
      + '<span class="cite">置信度：<b>低</b> · 依据:知识库无有效覆盖</span>';
  } else {
    const c = top.c;
    bumpRef(c.id);   // 真正被引用到的只有首选卡,计数回写到知识库
    html += '针对这个问题，知识库里有 <b>'+hits.filter(function(h){return h.score>=0.28;}).length
      + '</b> 张可引用的打法卡，最匹配的是：<br><br>'
      + '<b>【'+c.title+'】</b><br>'
      + '<span style="color:var(--t2)">做法：'+c.setup+'</span><br><br>'
      + '<span style="color:var(--t2)">适用前提：'+c.scene+'</span><br>'
      + '<span style="color:var(--red-700)">需要留意：'+c.limit+'</span>'
      + '<span class="cite">引用：<b>'+c.id+'</b>'
      + (function(){
          const rest = hits.filter(function(h){ return h.score>=0.28 && h.c.id!==c.id; })
                           .map(function(h){ return h.c.id; });
          return rest.length ? '（同批可引用：'+rest.join('、')+'）' : '';
        })()
      + ' · 置信度：<b>'+confWord(top.score)+'</b> · 匹配度 '+(top.score*100).toFixed(0)+'%</span>';
  }
  pushMsg('ai', html, q, hits);
}

  const el = document.getElementById('dwCtx');
  if(!el) return;
  const k = currentKey();
  el.textContent = k==='diagnosis'
    ? '当前 · 商家诊断（'+state.merchant+'）'
    : '当前 · ' + (PAGES[k] ? PAGES[k].title : '平台');

  /* 上下文开关必须显式可见:上一版抽屉顶部写着「当前 · 商家诊断」,
     但 ask() 其实完全不读商家数据——界面承诺了它做不到的事。
     要么做到,要么别写。现在是做到,并且让使用者能关掉。 */
  const bar = document.getElementById('dwCtxBar');
  if(!bar) return;
  const desc = ctxDesc();
  bar.innerHTML = desc
    ? '<button class="ctxchip'+(state.dwCtx===false?' off':'')+'" onclick="toggleDwCtx()">'
      + icon(state.dwCtx===false?'alert':'check',12)
      + (state.dwCtx===false ? '未带上下文' : '带上上下文 · '+desc.short) + '</button>'
      + '<span class="ctxhint">'+(state.dwCtx===false
          ? '回答只基于知识库检索'
          : '回答会先代入当前页面的读数,再检索知识库')+'</span>'
    : '<span class="ctxhint">平台级视图,无商家上下文</span>';
}

/* 当前页面能提供什么上下文 */
function ctxDesc(){
  const k = currentKey();
  if(k === 'diagnosis'){
    const d = diagFor(state.merchant);
    const bp = breakpointOf(d);
    return { short: state.merchant, kind:'merchant', d:d, bp:bp };
  }
  if(k === 'merchants'){
    /* 助手看到的「视图」要和页面上真正显示的行数一致,否则筛选后助手会报错数 */
    const f   = state.tier;
    const arr = MERCHANTS.filter(function(m){
      return (f==='全部' || m.tier===f) && (!state.riskOnly || m.health < HEALTH_RISK);
    });
    return { short: f+' '+arr.length+' 家'+(state.riskOnly ? '（仅风险商家，健康度 <'+HEALTH_RISK+'）' : ''),
             kind:'tier', tier:f, arr:arr };
  }
  if(k === 'knowledge') return { short:'知识库', kind:'kb' };
  return { short:'平台大盘', kind:'platform' };
}

function toggleDwCtx(){ state.dwCtx = state.dwCtx === false; updateDwCtx(); }

/* 回答前置的上下文块。检索本身不变,只是把「站在哪看的」先说清楚 */
function ctxBlock(){
  if(state.dwCtx === false) return '';
  const c = ctxDesc();
  let body;
  if(c.kind === 'merchant'){
    const d = c.d, m = MERCHANTS.filter(function(x){ return x.name === state.merchant; })[0];
    const ec = unitEcon(d, m);
    const a  = openActionOf(state.merchant);
    const mt = metricOf(d, c.bp);
    body = '<b>'+state.merchant+'</b>（'+(d.sector||'')+' · '+(d.tier||'')+'）· 健康度 <b>'+d.health+'</b>'
      + '<br>断点位置 <b>'+(c.bp.kind === 'none' ? '链路无显著断点' : mt.name + ' 所在的环节')+'</b>'
      + ' · 主指标 <b>'+mt.base+'</b>'
      + (ec ? '<br>LTV/CPA <b>'+ec.ratio.toFixed(1)+'×</b> · '+(ec.ok?'经济性达标':'经济性偏紧') : '')
      + '<br>处置状态 <b>'+(a ? a.id+' 观察中 · 剩 '+daysLeftOf(a)+' 天 · 负责人 '+a.owner
                                   : '未登记')+'</b>';
  } else if(c.kind === 'tier'){
    const arr = c.arr;
    const sp  = arr.reduce(function(s,m){ return s+m.spend; }, 0);
    const bad = arr.filter(function(m){ return m.health < HEALTH_RISK; }).length;
    body = '视图 <b>'+c.tier+'</b>'+(state.riskOnly ? '（已筛风险商家，健康度 <'+HEALTH_RISK+'）' : '')
      + ' · '+arr.length+' 家 · 合计消耗 <b>'+sp.toFixed(1)+' 万</b>'
      + ' · 健康度低于 '+HEALTH_RISK+' 的 <b>'+bad+'</b> 家';
  } else if(c.kind === 'kb'){
    body = '知识库共 <b>'+CARDS.length+'</b> 张打法卡 · 有引用记录 <b>'
      + CARDS.filter(function(x){ return refsOf(x.id) > 0; }).length+'</b> 张'
      + ' · 产品需求 <b>'+NEEDS.length+'</b> 条 · 其中方案在建 <b>'
      + NEEDS.filter(function(n){ return NEED_SHOW.indexOf(n.status) >= 0; }).length+'</b> 条';
  } else {
    const p = DATA.platform;
    body = '平台大盘 · 在投商家 <b>'+p.activeMch.toLocaleString()+'</b> 家'
         + ' · 本月消耗 <b>'+p.spend+' 亿</b> · 平台广告收入 <b>'+p.revenue+' 亿</b>';
  }
  return '<div class="ctxblk"><span class="tag">'+icon('target',12)+'上下文 · '+c.short+'</span>'
       + '<div class="bd">'+body+'</div></div>';
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ closeDrawer(); closeMsDrop(); }

/* 点击抽屉/搜索框以外的地方收起下拉 */

/* ---- 页面渲染后需要执行的初始化 ---- */
const AFTER = {

/* =========================================================

   ========================================================= */
function currentKey(){
  const k = (location.hash||'').replace('#/','') || 'overview';
  return RENDER[k] ? k : 'overview';
}
function go(key){

  else location.hash = h;
}
/* 从大盘告警下钻:自动把该商家设为当前诊断对象 */
function onAlert(name){

  go('diagnosis');
}
/* 从商家列表下钻 */
function openMerchant(name){

  go('diagnosis');
}
function setTier(t){ state.tier = t; renderShell(); }
function toggleRisk(){ state.riskOnly = !state.riskOnly; renderShell(); }
function toggleTierNote(){ state.tierNoteOpen = !state.tierNoteOpen; renderShell(); }
function toggleHealthNote(){ state.healthNoteOpen = !state.healthNoteOpen; renderShell(); }

function renderShell(){
  document.getElementById('brandMark').innerHTML = icon('sparkle',19);
  document.getElementById('aboutIco').innerHTML  = icon('info',16);
  document.getElementById('icoBell').innerHTML   = icon('bell',18);

  /* 商家搜索只在「针对单个商家」的页面出现;大盘面向全部商家,不设此项 */
  const ms = document.getElementById('msearch');

/* =========================================================
   商家搜索(模糊匹配)
   评分优先级:完全相等 > 子串命中(越靠前越高) > 子序列命中 > 公共字符覆盖率
   大小写不敏感;结果按分数降序,最多 8 条。
   ========================================================= */
function fuzzScore(name, q){
  const n = name.toLowerCase();
  if(n === q) return 1000;
  const at = n.indexOf(q);
  if(at >= 0) return 800 - at * 4 - n.length;           // 子串命中,越靠前越好
  let i = 0;                                            // 子序列命中(如 "bs" → "BBB店家"? 不,按字符)
  for(let k=0;k<n.length && i<q.length;k++){ if(n[k] === q[i]) i++; }
  if(i === q.length) return 500 - (n.length - q.length) * 6;
  const pool = n.split(''); let common = 0;             // 公共字符覆盖率
  for(let k=0;k<q.length;k++){
    const p = pool.indexOf(q[k]);
    if(p >= 0){ common++; pool.splice(p,1); }
  }
  return common ? common / q.length * 260 : 0;
}
function searchMerchants(q){
  const s = (q||'').trim().toLowerCase();
  const pool = MERCHANTS.map(function(m){
    return { m:m, score: s ? fuzzScore(m.name, s) : 100 - m.health };
  }).filter(function(x){ return x.score > 0; });
  pool.sort(function(a,b){ return b.score - a.score; });
  return pool.slice(0, 8);
}
function hlName(name, q){
  if(!q) return name;
  const i = name.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return name;
  return name.slice(0,i) + '<b>' + name.slice(i, i+q.length) + '</b>' + name.slice(i+q.length);
}
function onMerchantSearch(){
  const inp = document.getElementById('msInput'), drop = document.getElementById('msDrop');
  if(!inp || !drop) return;
  const q = inp.value.trim();
  const res = searchMerchants(q);
  drop.innerHTML = '<div class="ms-hd">' + (q ? '匹配到 ' + res.length + ' 家' : '全部商家 · 风险优先') + '</div>'
    + (res.length
        ? res.map(function(r){
            return '<div class="ms-item'+(r.m.name===state.merchant?' on':'')+'" onclick="pickMerchant(\''+r.m.name+'\')">'
              + '<span class="ms-name">'+hlName(r.m.name, q)+'</span>'
              + tierPill(r.m.tier, r.m)
              + '<span class="ms-spend">'+r.m.spend.toFixed(1)+' 万</span>'
              + '</div>';
          }).join('')
        : '<div class="ms-empty">没有匹配的商家<br><span style="font-size:11.5px">试试输入「店家」「案例」或商家名的一部分</span></div>');
  drop.classList.add('on');
}
function closeMsDrop(){
  const d = document.getElementById('msDrop');
  if(d) d.classList.remove('on');
}
function focusMerchantSearch(){
  const inp = document.getElementById('msInput');
  if(inp){ inp.focus(); onMerchantSearch(); }
}
function pickMerchant(name){
  const inp = document.getElementById('msInput');
  if(inp) inp.value = '';
  closeMsDrop();
  state.merchant = name;
  go('diagnosis');
}

/* ---- 产品矩阵定位弹窗 ---- */

  const rows = DATA.matrix.map(function(r){
    return '<div class="mrow'+(r.me?' me':'')+'">'
      + '<span class="stage">'+r.stage+'</span>'
      + '<span class="prod">'+r.prod+'</span>'
      + '<span class="tag">'+r.tag+'</span>'
      + '</div>';
  }).join('');
  const el = document.createElement('div');
  el.className = 'mask';
  el.onclick = function(e){ if(e.target===el) el.remove(); };
  el.innerHTML = '<div class="modal">'
    + '<div class="modal-h">'+icon('info',18)+'<h3>本作品在商业产品矩阵中的位置</h3>'
    + '<button class="x" onclick="this.closest(\'.mask\').remove()">✕</button></div>'
    + '<div class="modal-b">'
    + '<p style="margin:0 0 14px;font-size:13px;color:var(--t2);line-height:1.7">'
    + '平台商业化是一整套产品矩阵。本作品<b style="color:var(--t1)">只聚焦其中的「商家客户资产与经营诊断」环节</b>——'
    + '即平台侧运营如何管理商家、诊断其经营问题，并把个案沉淀为可复用的能力。</p>'
    + '<div class="matrix">'+rows+'</div>'
    + '<div class="hr"></div>'
    + '<p style="margin:0;font-size:12.5px;color:var(--t3);line-height:1.7">'
    + '个案沉淀有两条出口：<b style="color:var(--t1)">打法卡</b>给商家复用，'
    + '设计上可供矩阵内其他产品（投放平台的投放建议、商家后台的经营指引）复用；'
    + '<b style="color:var(--t1)">产品需求</b>则把商家侧修不了的断点（模型 / 回传 / 审核 / 报表）'
    + '升格成平台能力需求，交回产品与算法。'
    + '本作品为面试演示，全部数据为虚构，不代表任何平台真实经营数据。</p>'
    + '</div></div>';
  document.body.appendChild(el);
}

  if(e.key==='Escape'){ const m=document.querySelector('.mask'); if(m) m.remove(); }
});
